name: untisplus
description: "A Flutter application for managing and viewing school schedules, homework, and other related information. It provides features such as timetable management, homework tracking, and notifications to help students stay organized and on top of their academic responsibilities."

publish_to: 'none'

version: 4.0.1+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  dynamic_color: ^1.8.1
  flutter_launcher_icons: ^0.14.4
  
  cupertino_icons: ^1.0.8
  simple_animations: ^5.2.0
  home_widget: ^0.9.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  workmanager: ^0.9.0+3
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  image_picker: ^1.2.2
  google_generative_ai: ^0.4.7
  custom_refresh_indicator: ^4.0.1
  package_info_plus: ^9.0.1
  flutter_markdown_plus: ^1.0.7
  sensors_plus: ^7.0.0
  otp_auth: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#ff0632"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21