org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Keep legacy DSL enabled for compatibility with the existing build files.
android.newDsl=false
# The app and all plugins have been migrated to AGP 9 built-in Kotlin.
android.builtInKotlin=true
# Workaround: the Kotlin incremental caches double-close and abort the build
# with "Could not close incremental caches ... already registered" thrown from
# org.jetbrains.kotlin.incremental.IncrementalCachesManager. Reproducible on
# this machine, unrelated to disk space or stale files. Disabling incremental
# compilation skips IncrementalCachesManager entirely. Nine plugin modules
# compile Kotlin (workmanager_android 24 files, home_widget 12,
# android_file_picker 5, ...), so this trades a little rebuild time for a build
# that does not die at an arbitrary module.
# Try the in-process execution strategy which avoids the daemon-based
# incremental cache issues. This runs Kotlin compilation in the Gradle worker
# process rather than the separate Kotlin compile daemon.
kotlin.compiler.execution.strategy=in-process
