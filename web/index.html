<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Untis+ — a privacy-first, offline-capable WebUntis companion.">
  <meta name="theme-color" content="#0F766E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Untis+">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Untis+</title>
  <script>
    // Flutter stores the selected locale under this key on web. Fall back to
    // the browser only before the app has been opened once.
    (() => {
      const language = (localStorage.getItem('flutter.appLocale') || navigator.language || 'de').slice(0, 2);
      const copy = {
        de: 'Untis+ — dein datensparender, offlinefähiger WebUntis-Begleiter.',
        en: 'Untis+ — your privacy-first, offline-capable WebUntis companion.',
        fr: 'Untis+ — votre compagnon WebUntis privé et disponible hors ligne.',
        es: 'Untis+ — tu acompañante de WebUntis privado y disponible sin conexión.'
      };
      const locale = Object.prototype.hasOwnProperty.call(copy, language) ? language : 'de';
      document.documentElement.lang = locale;
      document.querySelector('meta[name="description"]')?.setAttribute('content', copy[locale]);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
