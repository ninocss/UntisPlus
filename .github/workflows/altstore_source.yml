name: Update AltStore Source

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: altstore-source
  cancel-in-progress: false

jobs:
  update_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve release metadata
        id: meta
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"
          DATE="$(date -d "$RELEASE_DATE" -u +%Y-%m-%d)"
          IPA_NAME="UntisPlus-${RELEASE_TAG}.ipa"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${IPA_NAME}"

          IPA_HTTP=$(curl -sS -o "/tmp/${IPA_NAME}" -w "%{http_code}" -L \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${IPA_URL}")
          echo "IPA download status: $IPA_HTTP (url: $IPA_URL)"
          if [ "$IPA_HTTP" != "200" ]; then
            echo "No IPA asset for ${RELEASE_TAG} – skipping source update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IPA_SIZE=$(stat -c%s "/tmp/${IPA_NAME}")

          mkdir -p /tmp/ipa_unpack
          unzip -q "/tmp/${IPA_NAME}" -d /tmp/ipa_unpack
          APP_PATH=$(find /tmp/ipa_unpack -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in IPA."
            exit 1
          fi

          CFB_VERSION=$(python3 -c "
          import plistlib, sys
          p = plistlib.load(open('$APP_PATH/Info.plist', 'rb'))
          print(p.get('CFBundleShortVersionString', '').strip())
          ")
          CFB_BUILD=$(python3 -c "
          import plistlib, sys
          p = plistlib.load(open('$APP_PATH/Info.plist', 'rb'))
          print(p.get('CFBundleVersion', '').strip())
          ")

          if [ -z "$CFB_VERSION" ] || [ -z "$CFB_BUILD" ]; then
            echo "ERROR: Could not read version keys from IPA Info.plist."
            exit 1
          fi

          echo "IPA CFBundleShortVersionString=$CFB_VERSION CFBundleVersion=$CFB_BUILD"

          echo "version=$CFB_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$CFB_BUILD" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "news_id=untisplus-release-$(echo "$CFB_VERSION" | tr '.' '-')" >> "$GITHUB_OUTPUT"

          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$RELEASE_BODY"
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "name<<RELEASE_NAME_EOF"
            echo "$RELEASE_NAME"
            echo "RELEASE_NAME_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate localizedDescription via Gemini
        id: ai
        if: ${{ steps.meta.outputs.skip != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          RELEASE_BODY: ${{ steps.meta.outputs.body }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "description=A new update with improvements and fixes." >> "$GITHUB_OUTPUT"
            echo "No GEMINI_API_KEY set – using default description."
            exit 0
          fi

          PROMPT=$(cat <<'PROMPT_EOF'
          You are writing the "What's New" section for an iOS app update on AltStore.
          The app is "Untis+", a privacy-first companion for WebUntis (school timetable, homework, notifications).

          Write a short "What's New" message for this release.

          Rules:
          - Output ONLY the description text, nothing else.
          - 1–3 short sentences.
          - Focus on the most important user-facing changes from the release notes.
          - If the release notes are empty or vague, write a generic "Bug fixes and improvements." style message.
          - Tone: friendly and practical. No emojis.
          PROMPT_EOF
          )

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg name "$RELEASE_NAME" \
            --arg version "$RELEASE_VERSION" \
            --arg body "$RELEASE_BODY" \
            '{
              contents: [
                {
                  role: "user",
                  parts: [
                    {
                      text: (
                        $prompt +
                        "\n\nRelease name: " + $name +
                        "\nVersion: " + $version +
                        "\nRelease notes:\n" + $body
                      )
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.3,
                responseMimeType: "text/plain"
              }
            }')

          request_model() {
            local model="$1"
            curl -sS "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          }

          extract_body() {
            jq -r '[
              (.candidates[0].content.parts // [] | map(.text // empty) | join("\n")),
              (.candidates // [] | map(.output_text // empty) | join("\n")),
              (.text // empty)
            ] | map(select(length > 0)) | .[0] // empty'
          }

          RESPONSE=$(request_model "$GEMINI_MODEL")
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          DESCRIPTION=$(echo "$RESPONSE" | extract_body)

          USED_MODEL="$GEMINI_MODEL"
          if [ -n "$API_ERROR" ] || [ -z "$DESCRIPTION" ]; then
            echo "Primary model failed. Trying fallback..."
            RESPONSE=$(request_model "$GEMINI_FALLBACK_MODEL")
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
            DESCRIPTION=$(echo "$RESPONSE" | extract_body)
            USED_MODEL="$GEMINI_FALLBACK_MODEL"
          fi

          if [ -n "$API_ERROR" ] || [ -z "$DESCRIPTION" ]; then
            echo "Gemini API error or empty response, using default."
            DESCRIPTION="A new update with improvements and bug fixes."
          fi

          DESCRIPTION=$(echo "$DESCRIPTION" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Generated description with $USED_MODEL: $DESCRIPTION"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Update source.json
        if: ${{ steps.meta.outputs.skip != 'true' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          DATE: ${{ steps.meta.outputs.date }}
          IPA_URL: ${{ steps.meta.outputs.ipa_url }}
          IPA_SIZE: ${{ steps.meta.outputs.ipa_size }}
          NEWS_ID: ${{ steps.meta.outputs.news_id }}
          DESCRIPTION: ${{ steps.ai.outputs.description }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail

          if [ "$IS_PRERELEASE" = "true" ]; then
            APP_INDEX=1
            APP_NAME="Untis+ Nightly"
            NEWS_TINT="1E4670"
            NEWS_APPID="com.ninocss.untisplus.Nightly"
          else
            APP_INDEX=0
            APP_NAME="Untis+"
            NEWS_TINT="4A90D9"
            NEWS_APPID="com.ninocss.untisplus"
          fi

          jq \
            --arg version "$VERSION" \
            --arg build_version "$BUILD_VERSION" \
            --arg date "$DATE" \
            --arg url "$IPA_URL" \
            --argjson size "${IPA_SIZE:-0}" \
            --arg desc "$DESCRIPTION" \
            --arg news_id "$NEWS_ID" \
            --arg repo "$REPO" \
            --arg app_name "$APP_NAME" \
            --arg news_tint "$NEWS_TINT" \
            --arg news_appid "$NEWS_APPID" \
            --argjson app_index "$APP_INDEX" \
            '
            .apps[$app_index].versions = ([
              {
                "version": $version,
                "buildVersion": $build_version,
                "date": $date,
                "localizedDescription": $desc,
                "downloadURL": $url,
                "size": $size,
                "minOSVersion": "15.0"
              }
            ] + (.apps[$app_index].versions | map(select(.version != $version))))
            |
            .news = ([
              {
                "title": $app_name + " " + $version + " is here",
                "identifier": $news_id,
                "caption": $desc,
                "date": $date,
                "tintColor": $news_tint,
                "imageURL": "https://raw.githubusercontent.com/" + $repo + "/main/assets/icon.png",
                "appID": $news_appid,
                "notify": true
              }
            ] + (.news | map(select(.identifier != $news_id))))
            ' altstore/source.json > altstore/source.json.tmp
          mv altstore/source.json.tmp altstore/source.json

          jq empty altstore/source.json
          echo "Validated JSON and updated source.json"

      - name: Commit and Push
        if: ${{ steps.meta.outputs.skip != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update AltStore source for ${{ steps.meta.outputs.tag }} [skip ci]"
          git push
