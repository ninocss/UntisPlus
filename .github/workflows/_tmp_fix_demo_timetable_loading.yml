name: Temporary unblock demo timetable rendering

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_demo_timetable_loading.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Render demo timetable before persistence side effects
        shell: python
        run: |
          from pathlib import Path

          main = Path('lib/main.dart')
          source = main.read_text(encoding='utf-8')
          old = """    if (isDemoMode) {\n      final tempWeek = DemoModeService.buildWeek(\n        requestedMonday,\n        locale: appLocaleNotifier.value,\n      );\n      _applyKnownSubjectsFromWeek(tempWeek);\n      await _fetchHomeworkAndNotes();\n      await _saveWeekToCache(\n        requestPersonId: requestPersonId,\n        requestPersonType: requestPersonType,\n        weekData: tempWeek,\n        monday: requestedMonday,\n      );\n      if (!isCurrentRequest()) return;\n      setState(() {\n        _weekData = tempWeek;\n        _showingCachedWeek = false;\n        _loading = false;\n        _loadError = null;\n      });\n      currentWeekDataNotifier.value = tempWeek;\n      unawaited(_updateHomeWidgets(tempWeek));\n      return;\n    }"""
          new = """    if (isDemoMode) {\n      final tempWeek = DemoModeService.buildWeek(\n        requestedMonday,\n        locale: appLocaleNotifier.value,\n      );\n      _applyKnownSubjectsFromWeek(tempWeek);\n      if (!isCurrentRequest()) return;\n      setState(() {\n        _weekData = tempWeek;\n        _showingCachedWeek = false;\n        _loading = false;\n        _loadError = null;\n      });\n      currentWeekDataNotifier.value = tempWeek;\n      // Demo data is already complete. Persistence, homework and home-widget\n      // refreshes must not keep the timetable behind a loading indicator.\n      unawaited(_fetchHomeworkAndNotes());\n      unawaited(\n        _saveWeekToCache(\n          requestPersonId: requestPersonId,\n          requestPersonType: requestPersonType,\n          weekData: tempWeek,\n          monday: requestedMonday,\n        ),\n      );\n      unawaited(_updateHomeWidgets(tempWeek));\n      return;\n    }"""
          if source.count(old) != 1:
              raise SystemExit(f'demo fetch target count: {source.count(old)}')
          main.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('test/widget_test.dart')
          test_source = test.read_text(encoding='utf-8')
          old = """    final localProvider = find.text('Lokal (On-Device)');\n    await pumpUntilFound(tester, localProvider);\n    await tapVisible(tester, localProvider);\n    await pumpUntilFound(tester, find.text('Lokales Modell'));"""
          new = """    final localProvider = find.text('Lokal (On-Device)');\n    await pumpUntilFound(tester, localProvider);\n    final providerScroll = find.ancestor(\n      of: localProvider,\n      matching: find.byType(Scrollable),\n    );\n    expect(providerScroll, findsOneWidget);\n    await tester.scrollUntilVisible(\n      localProvider,\n      180,\n      scrollable: providerScroll,\n    );\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(localProvider);\n    await pumpUntilFound(tester, find.text('Lokales Modell'));"""
          if test_source.count(old) != 1:
              raise SystemExit(f'local provider scroll target count: {test_source.count(old)}')
          test.write_text(test_source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_demo_timetable_loading.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit demo rendering fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Render demo timetable before background persistence'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
