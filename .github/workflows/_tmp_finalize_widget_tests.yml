name: Temporary finalize widget test isolation

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_finalize_widget_tests.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Finalize deterministic widget helpers
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/widget_test.dart')
          source = path.read_text(encoding='utf-8')

          old = """  Future<void> tapVisible(WidgetTester tester, Finder finder) async {\n    await tester.ensureVisible(finder);\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(finder);\n  }"""
          new = """  Future<void> tapVisible(WidgetTester tester, Finder finder) async {\n    final visible = finder.hitTestable();\n    if (visible.evaluate().isNotEmpty) {\n      await tester.tap(visible.first);\n      return;\n    }\n    await tester.ensureVisible(finder.first);\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(finder.hitTestable().first);\n  }\n\n  Future<Finder> ensureDayTimetableView(WidgetTester tester) async {\n    final dayCarousel = find.byKey(const ValueKey('day-timetable-carousel'));\n    for (var i = 0; i < 80; i++) {\n      if (dayCarousel.evaluate().isNotEmpty) return dayCarousel;\n      final switchToDay = find\n          .byIcon(Icons.calendar_view_day_rounded)\n          .hitTestable();\n      if (switchToDay.evaluate().isNotEmpty) {\n        await tester.tap(switchToDay.first);\n        await tester.pump(const Duration(milliseconds: 100));\n        continue;\n      }\n      await tester.pump(const Duration(milliseconds: 50));\n    }\n    expect(dayCarousel, findsOneWidget);\n    return dayCarousel;\n  }"""
          if source.count(old) != 1:
              raise SystemExit(f'tap helper target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """      await tester.pumpWidget(\n        UntisPlusApp(startScreen: WeeklyTimetablePage(key: ValueKey(size))),\n      );\n      final dayCarousel = find.byKey(const ValueKey('day-timetable-carousel'));\n      await pumpUntilFound(tester, dayCarousel);\n      expect(dayCarousel, findsOneWidget, reason: 'day viewport: $size');"""
          new = """      await tester.pumpWidget(\n        UntisPlusApp(startScreen: WeeklyTimetablePage(key: ValueKey(size))),\n      );\n      final dayCarousel = await ensureDayTimetableView(tester);\n      expect(dayCarousel, findsOneWidget, reason: 'day viewport: $size');"""
          if source.count(old) != 1:
              raise SystemExit(f'weekly day target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    final dayCarousel = find.byKey(const ValueKey('day-timetable-carousel'));\n    await pumpUntilFound(tester, dayCarousel);\n    expect(dayCarousel, findsOneWidget);"""
          new = """    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    final dayCarousel = await ensureDayTimetableView(tester);\n    expect(dayCarousel, findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'date day target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(\n      const UntisPlusApp(startScreen: SettingsAppearancePage()),\n    );\n    await tester.pump(const Duration(milliseconds: 250));\n    expect(find.text('Stunden- & Kartendesign'), findsNothing);"""
          new = """    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.pumpWidget(\n      const UntisPlusApp(startScreen: SettingsAppearancePage()),\n    );\n    await tester.pump(const Duration(milliseconds: 250));\n    expect(find.text('Stunden- & Kartendesign'), findsNothing);"""
          if source.count(old) != 1:
              raise SystemExit(f'appearance reset target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_finalize_widget_tests.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit deterministic widget tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Make widget tests deterministic'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
