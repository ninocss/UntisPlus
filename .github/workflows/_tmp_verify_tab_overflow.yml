name: Temporary verify tab overflow fix

on:
  push:
    branches:
      - fix/flutter-test-stability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Prevent narrow info badge overflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          old = """          Text(\n            text,\n            style: GoogleFonts.outfit(\n              fontSize: 12,\n              fontWeight: FontWeight.w600,\n              color: cs.onSurface,\n            ),\n          ),"""
          new = """          Flexible(\n            child: Text(\n              text,\n              maxLines: 1,\n              overflow: TextOverflow.ellipsis,\n              style: GoogleFonts.outfit(\n                fontSize: 12,\n                fontWeight: FontWeight.w600,\n                color: cs.onSurface,\n              ),\n            ),\n          ),"""
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one info badge target, found {source.count(old)}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_verify_tab_overflow.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit responsive badge fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart .github/workflows/_tmp_verify_tab_overflow.yml
          git commit -m 'Prevent narrow exam info badge overflow'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run interactive tutorial widget test
        continue-on-error: true
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'interactive tutorial supports next, back, and skip'

      - name: Run tablet navigation widget test
        continue-on-error: true
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'tablet navigation and settings switch at shared breakpoints'
