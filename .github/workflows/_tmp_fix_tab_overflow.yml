name: Temporary tab overflow fix

on:
  push:
    branches:
      - fix/flutter-test-stability

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Apply responsive TabBar fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/main.dart')
          source = path.read_text(encoding='utf-8')
          old = """          dividerColor: Colors.transparent,\n          labelStyle: GoogleFonts.outfit("""
          new = """          dividerColor: Colors.transparent,\n          isScrollable: true,\n          labelStyle: GoogleFonts.outfit("""
          if new not in source:
              if source.count(old) != 1:
                  raise SystemExit(f'Expected exactly one target TabBar, found {source.count(old)}')
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_tab_overflow.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/main.dart .github/workflows/_tmp_fix_tab_overflow.yml
          git commit -m 'Fix horizontal exams tab overflow'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run interactive tutorial widget test
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'interactive tutorial supports next, back, and skip'

      - name: Run tablet navigation widget test
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'tablet navigation and settings switch at shared breakpoints'
