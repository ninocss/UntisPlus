name: Temporary fix option sheet material assertion

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_option_sheet_material.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Fix option sheet material hierarchy and local provider tap
        shell: python
        run: |
          from pathlib import Path

          shared = Path('lib/core/shared_ui.dart')
          source = shared.read_text(encoding='utf-8')
          old = """                      return ListTile(\n                        leading:\n                            opt.leading ??\n                            (opt.icon != null\n                                ? Icon(\n                                    opt.icon,\n                                    color: opt.destructive\n                                        ? cs.error\n                                        : (opt.selected ? cs.primary : null),\n                                  )\n                                : null),\n                        title: Text(\n                          opt.title,\n                          style: TextStyle(\n                            color: opt.destructive\n                                ? cs.error\n                                : (opt.selected ? cs.primary : null),\n                            fontWeight: opt.selected ? FontWeight.bold : null,\n                          ),\n                        ),\n                        subtitle: opt.subtitle != null\n                            ? Text(opt.subtitle!)\n                            : null,\n                        trailing: opt.selected\n                            ? Icon(Icons.check, color: cs.primary)\n                            : null,\n                        onTap: () {\n                          Navigator.pop(ctx, opt.value);\n                        },\n                      );"""
          new = """                      return Material(\n                        color: Colors.transparent,\n                        child: ListTile(\n                          leading:\n                              opt.leading ??\n                              (opt.icon != null\n                                  ? Icon(\n                                      opt.icon,\n                                      color: opt.destructive\n                                          ? cs.error\n                                          : (opt.selected ? cs.primary : null),\n                                    )\n                                  : null),\n                          title: Text(\n                            opt.title,\n                            style: TextStyle(\n                              color: opt.destructive\n                                  ? cs.error\n                                  : (opt.selected ? cs.primary : null),\n                              fontWeight: opt.selected ? FontWeight.bold : null,\n                            ),\n                          ),\n                          subtitle: opt.subtitle != null\n                              ? Text(opt.subtitle!)\n                              : null,\n                          trailing: opt.selected\n                              ? Icon(Icons.check, color: cs.primary)\n                              : null,\n                          onTap: () {\n                            Navigator.pop(ctx, opt.value);\n                          },\n                        ),\n                      );"""
          if source.count(old) != 1:
              raise SystemExit(f'option sheet target count: {source.count(old)}')
          shared.write_text(source.replace(old, new, 1), encoding='utf-8')

          test = Path('test/widget_test.dart')
          test_source = test.read_text(encoding='utf-8')
          old = """    await tester.tap(find.text('Google Gemini'));\n    await pumpUntilFound(tester, find.text('Lokal (On-Device)'));\n    await tester.tap(find.text('Lokal (On-Device)'));\n    await pumpUntilFound(tester, find.text('Lokales Modell'));"""
          new = """    await tapVisible(tester, find.text('Google Gemini'));\n    final localProvider = find.text('Lokal (On-Device)');\n    await pumpUntilFound(tester, localProvider);\n    await tapVisible(tester, localProvider);\n    await pumpUntilFound(tester, find.text('Lokales Modell'));"""
          if test_source.count(old) != 1:
              raise SystemExit(f'local provider tap target count: {test_source.count(old)}')
          test.write_text(test_source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_option_sheet_material.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit option sheet fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/shared_ui.dart
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Fix option sheet material hierarchy'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
