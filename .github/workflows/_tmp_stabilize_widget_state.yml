name: Temporary stabilize widget state

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_stabilize_widget_state.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Harden widget test isolation
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/widget_test.dart')
          source = path.read_text(encoding='utf-8')

          old = """  setUp(() {\n    SharedPreferences.setMockInitialValues({});\n    appLocaleNotifier.value = 'de';"""
          new = """  setUp(() {\n    SharedPreferences.setMockInitialValues({'viewMode': 0});\n    demoModeNotifier.value = false;\n    appLocaleNotifier.value = 'de';"""
          if source.count(old) != 1:
              raise SystemExit(f'setUp target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """      await tester.pumpWidget(\n        UntisPlusApp(startScreen: WeeklyTimetablePage(key: ValueKey(size))),\n      );\n      await tester.pumpAndSettle();\n      await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n      await tester.pumpAndSettle();\n      expect(tester.takeException(), isNull, reason: 'viewport: $size');"""
          new = """      final prefs = await SharedPreferences.getInstance();\n      await prefs.setInt('viewMode', 0);\n      await tester.pumpWidget(\n        UntisPlusApp(startScreen: WeeklyTimetablePage(key: ValueKey(size))),\n      );\n      await tester.pump(const Duration(milliseconds: 600));\n      expect(\n        find.byKey(const ValueKey('day-timetable-carousel')),\n        findsOneWidget,\n        reason: 'day viewport: $size',\n      );\n      await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n      await tester.pump(const Duration(milliseconds: 500));\n      expect(\n        find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n        findsOneWidget,\n        reason: 'week viewport: $size',\n      );\n      expect(tester.takeException(), isNull, reason: 'viewport: $size');\n      await prefs.setInt('viewMode', 0);"""
          if source.count(old) != 1:
              raise SystemExit(f'weekly viewport target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    await tester.pump(const Duration(milliseconds: 500));\n    await tester.tap(find.byKey(const ValueKey('timetable-day-tab-1')));\n    await tester.pump(const Duration(milliseconds: 350));\n    expect(find.byKey(const ValueKey('day-timetable-carousel')), findsOneWidget);\n\n    await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n    await tester.pump(const Duration(milliseconds: 250));\n    await tester.drag(\n      find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n      const Offset(-260, 0),\n    );\n    await tester.pump(const Duration(milliseconds: 400));"""
          new = """    final prefs = await SharedPreferences.getInstance();\n    await prefs.setInt('viewMode', 0);\n    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    await tester.pump(const Duration(milliseconds: 600));\n    expect(find.byKey(const ValueKey('day-timetable-carousel')), findsOneWidget);\n    await tester.tap(find.byKey(const ValueKey('timetable-day-tab-1')));\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byKey(const ValueKey('day-timetable-carousel')), findsOneWidget);\n\n    await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(\n      find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n      findsOneWidget,\n    );\n    await tester.drag(\n      find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n      const Offset(-260, 0),\n    );\n    await tester.pump(const Duration(milliseconds: 400));\n    await prefs.setInt('viewMode', 0);"""
          if source.count(old) != 1:
              raise SystemExit(f'date tabs target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    expect(find.text('Stunden- & Kartendesign'), findsOneWidget);\n    await tester.tap(find.text('Stunden- & Kartendesign'));\n    await tester.pump(const Duration(milliseconds: 250));\n    expect(find.byType(SettingsLessonDesignPage), findsOneWidget);"""
          new = """    final designEntry = find.text('Stunden- & Kartendesign');\n    expect(designEntry, findsOneWidget);\n    await tester.ensureVisible(designEntry);\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(designEntry);\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byType(SettingsLessonDesignPage), findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'timetable settings target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    tester.view.physicalSize = const Size(768, 1024);\n    await tester.pumpWidget(const UntisPlusApp(startScreen: SettingsHubPage()));\n    await tester.pump(const Duration(milliseconds: 250));\n    expect(find.byKey(const ValueKey('settings-master-detail')), findsNothing);\n    await tester.tap(find.text('Erscheinungsbild').first);\n    await tester.pump(const Duration(milliseconds: 250));\n    expect(find.byType(SettingsAppearancePage), findsOneWidget);"""
          new = """    tester.view.physicalSize = const Size(768, 1024);\n    await tester.pumpWidget(const UntisPlusApp(startScreen: SettingsHubPage()));\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byKey(const ValueKey('settings-master-detail')), findsNothing);\n    final appearanceEntry = find.text('Erscheinungsbild').first;\n    await tester.ensureVisible(appearanceEntry);\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(appearanceEntry);\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byType(SettingsAppearancePage), findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'tablet compact target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          workflow = Path('.github/workflows/_tmp_stabilize_widget_state.yml')
          if workflow.exists():
              workflow.unlink()
          path.write_text(source, encoding='utf-8')

      - name: Commit test stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/widget_test.dart .github/workflows/_tmp_stabilize_widget_state.yml
          git commit -m 'Stabilize stateful widget tests'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
