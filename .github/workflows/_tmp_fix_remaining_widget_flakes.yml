name: Temporary stabilize remaining widget tests

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_remaining_widget_flakes.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Stabilize onboarding and timetable tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/widget_test.dart')
          source = path.read_text(encoding='utf-8')

          source = source.replace(
          """    demoModeNotifier.value = false;\n    appLocaleNotifier.value = 'de';""",
          """    demoModeNotifier.value = false;\n    aiProvider = 'gemini';\n    appLocaleNotifier.value = 'de';""",
          1,
          )

          old = """    final onboardingPrefs = await SharedPreferences.getInstance();\n    await onboardingPrefs.setInt('onboardingCheckpoint', 0);\n    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump(const Duration(milliseconds: 100));\n    await tapVisible(tester, find.text('Weiter'));\n\n    final onboardingCard = find.byKey(\n      const ValueKey('onboarding-theme-default'),\n    );\n    await pumpUntilFound(tester, onboardingCard);"""
          new = """    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    SharedPreferences.setMockInitialValues({\n      'viewMode': 0,\n      // This test covers the theme page layout, not the welcome-page transition.\n      'onboardingCheckpoint': 1,\n    });\n    await tester.pumpWidget(\n      const UntisPlusApp(\n        startScreen: OnboardingFlow(key: ValueKey('theme-layout-onboarding')),\n      ),\n    );\n\n    final onboardingCard = find.byKey(\n      const ValueKey('onboarding-theme-default'),\n    );\n    await pumpUntilFound(tester, onboardingCard);"""
          if source.count(old) != 1:
              raise SystemExit(f'theme block target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    final prefs = await SharedPreferences.getInstance();\n    await prefs.setInt('onboardingCheckpoint', 0);\n    aiProvider = 'local';\n    await prefs.setString('aiProvider', 'local');\n    addTearDown(() => aiProvider = 'gemini');\n    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump(const Duration(milliseconds: 100));\n\n    await tapVisible(tester, find.text('Weiter'));"""
          new = """    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    SharedPreferences.setMockInitialValues({\n      'viewMode': 0,\n      'onboardingCheckpoint': 0,\n      'aiProvider': 'local',\n    });\n    aiProvider = 'local';\n    addTearDown(() => aiProvider = 'gemini');\n    await tester.pumpWidget(\n      const UntisPlusApp(\n        startScreen: OnboardingFlow(key: ValueKey('local-ai-onboarding')),\n      ),\n    );\n    await pumpUntilFound(tester, find.text('Weiter'));\n\n    await tapVisible(tester, find.text('Weiter'));"""
          if source.count(old) != 1:
              raise SystemExit(f'local AI block target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.tap(find.byKey(const ValueKey('timetable-day-tab-1')));\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byKey(const ValueKey('day-timetable-carousel')), findsOneWidget);"""
          new = """    await tester.tap(find.byKey(const ValueKey('timetable-day-tab-1')));\n    final refreshedDayCarousel = await ensureDayTimetableView(tester);\n    expect(refreshedDayCarousel, findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'timetable block target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          workflow = Path('.github/workflows/_tmp_fix_remaining_widget_flakes.yml')
          workflow.unlink()

      - name: Commit test stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Stabilize remaining onboarding and timetable widget tests'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run affected widget tests
        shell: pwsh
        run: |
          ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'theme choices keep fixed heights and gain tablet columns'
          ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'local AI onboarding uses a model download instead of API key'
          ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'timetable date tabs and weekly swipe stay interactive'
