name: Daily Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      use_fllama_cache:
        description: 'fllama-Native-Build-Cache verwenden (bei false wird frisch kompiliert)'
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  check_changes:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.changed }}
      nightly_tag: ${{ steps.meta.outputs.tag }}
      nightly_date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        name: Check for changes in the last 24 hours
        run: |
          if git log --oneline --since='24 hours ago' | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        name: Resolve nightly metadata
        run: |
          date="$(date -u +'%Y-%m-%d')"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$date" >> "$GITHUB_OUTPUT"

  build_android:
    needs: check_changes
    if: needs.check_changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Cache fllama native builds
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-android-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Nightly APKs must use the production signing key.'
            exit 1
          fi
          key_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$key_dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$key_dir/upload-keystore.jks"
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$key_dir/upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies and build APKs
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release
          mkdir -p universal_apk
          cp build/app/outputs/flutter-apk/app-release.apk universal_apk/
          flutter build apk --release --split-per-abi

      - name: Prepare verified update assets
        env:
          TAG: ${{ needs.check_changes.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          cp universal_apk/app-release.apk "release_assets/UntisPlus-${TAG}-universal.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "release_assets/UntisPlus-${TAG}-${abi}.apk"
          done
          (
            cd release_assets
            sha256sum *.apk > SHA256SUMS.txt
            assets="$({
              for f in *.apk; do
                abi="universal"
                case "$f" in
                  *-armeabi-v7a.apk) abi="armeabi-v7a" ;;
                  *-arm64-v8a.apk) abi="arm64-v8a" ;;
                  *-x86_64.apk) abi="x86_64" ;;
                esac
                jq -n --arg name "$f" --arg abi "$abi" \
                  --arg sha "$(sha256sum "$f" | awk '{print $1}')" \
                  --argjson size "$(stat -c%s "$f")" \
                  '{name: $name, abi: $abi, sha256: $sha, size_bytes: $size}'
              done
            } | jq -s '.')"
            jq -n --arg tag "$TAG" --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson assets "$assets" \
              '{tag: $tag, channel: "nightly", generated_at: $generated_at, assets: $assets}' \
              > release-manifest.json
          )

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-android
          path: release_assets/
          if-no-files-found: error

  build_ipa:
    needs: check_changes
    if: needs.check_changes.outputs.has_changes == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Cache fllama native builds
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-ios-${{ hashFiles('pubspec.lock') }}

      - name: Build unsigned IPA
        env:
          TAG: ${{ needs.check_changes.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          sed -i 's/PRODUCT_BUNDLE_IDENTIFIER = com.ninocss.untisplus;/PRODUCT_BUNDLE_IDENTIFIER = com.ninocss.untisplus.Nightly;/g' ios/Runner.xcodeproj/project.pbxproj
          flutter pub get
          flutter build ios --release --no-codesign
          mkdir -p release_assets/Payload
          ditto --norsrc build/ios/iphoneos/Runner.app release_assets/Payload/Runner.app
          (cd release_assets && zip -r "UntisPlus-${TAG}.ipa" Payload && rm -rf Payload)

      - uses: actions/upload-artifact@v6
        with:
          name: nightly-ios
          path: release_assets/*.ipa
          if-no-files-found: error

  release:
    needs: [check_changes, build_android, build_ipa]
    if: >-
      needs.check_changes.outputs.has_changes == 'true' &&
      needs.build_android.result == 'success' &&
      needs.build_ipa.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nightly-android
          path: release_assets

      - uses: actions/download-artifact@v7
        with:
          name: nightly-ios
          path: release_assets

      - name: Write nightly notes
        env:
          NIGHTLY_DATE: ${{ needs.check_changes.outputs.nightly_date }}
        run: |
          {
            echo "# Nightly build · $NIGHTLY_DATE"
            echo
            echo 'Automated, signed Android preview build from the latest changes.'
            echo 'Use a stable release for everyday use; pre-releases are not selected by the in-app updater.'
          } > release_assets/release_notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.check_changes.outputs.nightly_tag }}
          name: Nightly Build · ${{ needs.check_changes.outputs.nightly_date }}
          body_path: release_assets/release_notes.md
          files: release_assets/*
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update_altstore_source:
    needs: [check_changes, build_android, build_ipa, release]
    if: >-
      needs.check_changes.outputs.has_changes == 'true' &&
      needs.build_android.result == 'success' &&
      needs.build_ipa.result == 'success' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve nightly release metadata
        id: meta
        env:
          TAG: ${{ needs.check_changes.outputs.nightly_tag }}
          DATE: ${{ needs.check_changes.outputs.nightly_date }}
        run: |
          set -euo pipefail

          IPA_NAME="UntisPlus-${TAG}.ipa"
          IPA_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${IPA_NAME}"
          curl -sS -o "/tmp/${IPA_NAME}" -L "${IPA_URL}"

          IPA_SIZE=$(stat -c%s "/tmp/${IPA_NAME}")

          mkdir -p /tmp/ipa_unpack
          unzip -q "/tmp/${IPA_NAME}" -d /tmp/ipa_unpack
          APP_PATH=$(find /tmp/ipa_unpack -maxdepth 2 -name "*.app" | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found in IPA."
            exit 1
          fi

          CFB_VERSION=$(python3 -c "
          import plistlib
          p = plistlib.load(open('$APP_PATH/Info.plist', 'rb'))
          print(p.get('CFBundleShortVersionString', '').strip())
          ")

          if [ -z "$CFB_VERSION" ]; then
            echo "ERROR: Could not read version from IPA Info.plist."
            exit 1
          fi

          echo "Nightly IPA CFBundleShortVersionString=$CFB_VERSION size=$IPA_SIZE"
          echo "version=${CFB_VERSION}-nightly.${DATE}" >> "$GITHUB_OUTPUT"
          echo "build_version=${CFB_VERSION}-nightly.${DATE}" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

      - name: Update altstore/source.json with nightly build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
          DATE: ${{ steps.meta.outputs.date }}
          IPA_URL: ${{ steps.meta.outputs.ipa_url }}
          IPA_SIZE: ${{ steps.meta.outputs.ipa_size }}
        run: |
          set -euo pipefail

          DESCRIPTION="Today's Nightly build of Untis+ with the latest changes and improvements. Please note that nightly builds may be less stable than official releases."

          jq \
            --arg version "$VERSION" \
            --arg build_version "$BUILD_VERSION" \
            --arg date "$DATE" \
            --arg url "$IPA_URL" \
            --argjson size "${IPA_SIZE:-0}" \
            --arg desc "$DESCRIPTION" \
            '
            .apps[1].versions = ([
              {
                "version": $version,
                "buildVersion": $build_version,
                "date": $date,
                "localizedDescription": $desc,
                "downloadURL": $url,
                "size": $size,
                "minOSVersion": "15.0"
              }
            ] + (.apps[1].versions | map(select(.version != $version))))
            ' altstore/source.json > altstore/source.json.tmp
          mv altstore/source.json.tmp altstore/source.json

          jq empty altstore/source.json
          echo "Validated JSON and updated altstore/source.json"

      - name: Commit and Push AltStore source update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add altstore/source.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: publish ${{ steps.meta.outputs.tag }} nightly to AltStore source [skip ci]"
          git push
