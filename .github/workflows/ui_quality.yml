name: UI quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install production dependencies
        run: flutter pub get
      - name: Core and widget regression
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 --reporter expanded
      - name: Analyze production configuration
        run: flutter analyze --no-pub
