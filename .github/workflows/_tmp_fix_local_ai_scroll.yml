name: Temporary fix local AI onboarding test

on:
  push:
    branches: [fix/flutter-test-stability]
    paths:
      - '.github/workflows/_tmp_fix_local_ai_scroll.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Make provider option hit-testable
        shell: python
        run: |
          from pathlib import Path

          test = Path('test/widget_test.dart')
          source = test.read_text(encoding='utf-8')
          old = """    final providerScroll = find.ancestor(
      of: localProvider,
      matching: find.byType(Scrollable),
    );
    expect(providerScroll, findsOneWidget);
    await tester.scrollUntilVisible(
      localProvider,
      -180,
      scrollable: providerScroll,
    );
    await tester.pump(const Duration(milliseconds: 100));
    final visibleLocalProvider = localProvider.hitTestable();
    expect(visibleLocalProvider, findsOneWidget);
    await tester.tap(visibleLocalProvider);"""
          new = """    final providerScroll = find.ancestor(
      of: localProvider,
      matching: find.byType(Scrollable),
    );
    expect(providerScroll, findsOneWidget);
    // The local provider sits just below the visible bottom-sheet viewport on
    // the tablet test size. Drag the sheet list upward before tapping it.
    await tester.drag(providerScroll, const Offset(0, -320));
    await tester.pump(const Duration(milliseconds: 150));
    final localProviderTile = find.ancestor(
      of: localProvider,
      matching: find.byType(ListTile),
    );
    expect(localProviderTile, findsOneWidget);
    final visibleLocalProviderTile = localProviderTile.hitTestable();
    expect(visibleLocalProviderTile, findsOneWidget);
    await tester.tap(visibleLocalProviderTile);"""
          if source.count(old) != 1:
              raise SystemExit(f'target count: {source.count(old)}')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_local_ai_scroll.yml')
          workflow.unlink()

      - name: Commit test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Stabilize local AI onboarding provider selection test'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run local AI onboarding widget test
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name 'local AI onboarding uses a model download instead of API key'
