name: Temporary fix local AI onboarding interaction

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_local_ai_scroll.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Fix local provider interaction
        shell: python
        run: |
          from pathlib import Path

          test = Path('test/widget_test.dart')
          source = test.read_text(encoding='utf-8')
          old = """    final providerScroll = find.ancestor(\n      of: localProvider,\n      matching: find.byType(Scrollable),\n    );\n    expect(providerScroll, findsOneWidget);\n    await tester.scrollUntilVisible(\n      localProvider,\n      -180,\n      scrollable: providerScroll,\n    );\n    await tester.pump(const Duration(milliseconds: 100));\n    final visibleLocalProvider = localProvider.hitTestable();\n    expect(visibleLocalProvider, findsOneWidget);\n    await tester.tap(visibleLocalProvider);"""
          new = """    final providerScroll = find.ancestor(\n      of: localProvider,\n      matching: find.byType(Scrollable),\n    );\n    expect(providerScroll, findsOneWidget);\n    await tester.drag(providerScroll, const Offset(0, -320));\n    await tester.pump(const Duration(milliseconds: 150));\n    final localProviderTile = find.ancestor(\n      of: localProvider,\n      matching: find.byType(ListTile),\n    );\n    expect(localProviderTile, findsOneWidget);\n    final visibleLocalProviderTile = localProviderTile.hitTestable();\n    expect(visibleLocalProviderTile, findsOneWidget);\n    await tester.tap(visibleLocalProviderTile);"""
          if source.count(old) != 1:
              raise SystemExit(f'local AI interaction target count: {source.count(old)}')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_local_ai_scroll.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit local AI test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Stabilize local AI onboarding provider selection test'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run local AI onboarding widget test
        shell: pwsh
        run: |
          ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name "local AI onboarding uses a model download instead of API key"
