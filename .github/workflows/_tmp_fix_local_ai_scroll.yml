name: Temporary local AI test fix

on: push

permissions:
  contents: write

jobs:
  patch_and_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Patch local provider interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          test = Path('test/widget_test.dart')
          source = test.read_text(encoding='utf-8')
          old = """    final providerScroll = find.ancestor(
              of: localProvider,
              matching: find.byType(Scrollable),
            );
            expect(providerScroll, findsOneWidget);
            await tester.scrollUntilVisible(
              localProvider,
              -180,
              scrollable: providerScroll,
            );
            await tester.pump(const Duration(milliseconds: 100));
            final visibleLocalProvider = localProvider.hitTestable();
            expect(visibleLocalProvider, findsOneWidget);
            await tester.tap(visibleLocalProvider);"""
          # Match the actual Dart indentation independently of YAML indentation.
          old = old.replace('            ', '    ', 1)
          old = old.replace('\n            ', '\n    ')
          new = """    final providerScroll = find.ancestor(
      of: localProvider,
      matching: find.byType(Scrollable),
    );
    expect(providerScroll, findsOneWidget);
    await tester.drag(providerScroll, const Offset(0, -320));
    await tester.pump(const Duration(milliseconds: 150));
    final localProviderTile = find.ancestor(
      of: localProvider,
      matching: find.byType(ListTile),
    );
    expect(localProviderTile, findsOneWidget);
    final visibleLocalProviderTile = localProviderTile.hitTestable();
    expect(visibleLocalProviderTile, findsOneWidget);
    await tester.tap(visibleLocalProviderTile);"""
          if old not in source:
              raise SystemExit('local provider block not found')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/_tmp_fix_local_ai_scroll.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Stabilize local AI onboarding provider selection test'
          git push origin HEAD:fix/flutter-test-stability

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Verify local AI onboarding test
        shell: bash
        run: pwsh -NoProfile -File tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name "local AI onboarding uses a model download instead of API key"
