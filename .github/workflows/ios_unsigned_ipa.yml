name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
      artifact_name:
        description: 'Name of the uploaded artifact'
        required: true
        default: 'unsigned-ipa'
      use_fllama_cache:
        description: 'Use the fllama native-build cache (false forces a fresh build)'
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build_ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache fllama native builds
        if: ${{ github.event.inputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-ios-${{ hashFiles('pubspec.lock') }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          mkdir -p Payload
          ditto --norsrc build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r "UntisPlus-${VERSION}.ipa" Payload
          rm -rf Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: UntisPlus-*.ipa
          retention-days: 30
