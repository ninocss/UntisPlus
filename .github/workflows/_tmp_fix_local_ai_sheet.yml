name: Temporary target AI provider sheet

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_local_ai_sheet.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Target provider option inside modal sheet
        shell: python
        run: |
          from pathlib import Path

          test = Path('test/widget_test.dart')
          source = test.read_text(encoding='utf-8')
          old = """    await tapVisible(tester, find.text('Google Gemini'));\n    final localProvider = find.text('Lokal (On-Device)');\n    await pumpUntilFound(tester, localProvider);\n    final providerScroll = find.ancestor(\n      of: localProvider,\n      matching: find.byType(Scrollable),\n    );\n    expect(providerScroll, findsOneWidget);\n    await tester.drag(providerScroll, const Offset(0, -320));\n    await tester.pump(const Duration(milliseconds: 150));\n    final localProviderTile = find.ancestor(\n      of: localProvider,\n      matching: find.byType(ListTile),\n    );\n    expect(localProviderTile, findsOneWidget);\n    final visibleLocalProviderTile = localProviderTile.hitTestable();\n    expect(visibleLocalProviderTile, findsOneWidget);\n    await tester.tap(visibleLocalProviderTile);"""
          new = """    await tapVisible(tester, find.text('Google Gemini'));\n    final providerSheet = find.byType(BottomSheet);\n    await pumpUntilFound(tester, providerSheet);\n    final providerScroll = find.descendant(\n      of: providerSheet,\n      matching: find.byType(Scrollable),\n    ).hitTestable();\n    expect(providerScroll, findsOneWidget);\n    await tester.drag(providerScroll, const Offset(0, -320));\n    await tester.pump(const Duration(milliseconds: 150));\n    final localProvider = find.descendant(\n      of: providerSheet,\n      matching: find.text('Lokal (On-Device)'),\n    ).hitTestable();\n    expect(localProvider, findsOneWidget);\n    await tester.tap(localProvider);"""
          if source.count(old) != 1:
              raise SystemExit(f'provider-sheet target count: {source.count(old)}')
          test.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_local_ai_sheet.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit provider sheet test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Target AI provider option inside modal sheet'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run local AI onboarding widget test
        shell: pwsh
        run: |
          ./tool/test_without_local_ai.ps1 test/widget_test.dart --plain-name "local AI onboarding uses a model download instead of API key"
