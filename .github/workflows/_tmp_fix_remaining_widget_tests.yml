name: Temporary fix remaining widget test races

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_remaining_widget_tests.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Patch state-based widget waits
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/widget_test.dart')
          source = path.read_text(encoding='utf-8')

          old = """void main() {\n  setUp(() {\n    SharedPreferences.setMockInitialValues({'viewMode': 0});"""
          new = """void main() {\n  Future<void> pumpUntilFound(\n    WidgetTester tester,\n    Finder finder, {\n    int maxPumps = 80,\n    Duration step = const Duration(milliseconds: 50),\n  }) async {\n    for (var i = 0; i < maxPumps; i++) {\n      if (finder.evaluate().isNotEmpty) return;\n      await tester.pump(step);\n    }\n    expect(finder, findsWidgets);\n  }\n\n  Future<void> tapVisible(WidgetTester tester, Finder finder) async {\n    await tester.ensureVisible(finder);\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(finder);\n  }\n\n  setUp(() {\n    SharedPreferences.setMockInitialValues({\n      'viewMode': 0,\n      'onboardingCheckpoint': 0,\n    });"""
          if source.count(old) != 1:
              raise SystemExit(f'helper/setUp target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump();\n    await tester.tap(find.text('Weiter'));\n    await tester.pump(const Duration(milliseconds: 650));\n\n    final onboardingCard = find.byKey(\n      const ValueKey('onboarding-theme-default'),\n    );"""
          new = """    final onboardingPrefs = await SharedPreferences.getInstance();\n    await onboardingPrefs.setInt('onboardingCheckpoint', 0);\n    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump(const Duration(milliseconds: 100));\n    await tapVisible(tester, find.text('Weiter'));\n\n    final onboardingCard = find.byKey(\n      const ValueKey('onboarding-theme-default'),\n    );\n    await pumpUntilFound(tester, onboardingCard);"""
          if source.count(old) != 1:
              raise SystemExit(f'theme onboarding target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """      SharedPreferences.setMockInitialValues({});\n      tester.view.physicalSize = size;\n      await tester.pumpWidget(\n        UntisPlusApp(startScreen: OnboardingFlow(key: ValueKey(size))),\n      );\n      await tester.pump(const Duration(milliseconds: 500));\n      expect(tester.takeException(), isNull, reason: 'welcome viewport: $size');\n\n      await tester.tap(find.text('Weiter'));\n      await tester.pump(const Duration(milliseconds: 650));\n      expect(\n        find.byKey(const ValueKey('onboarding-theme-preview')),\n        findsOneWidget,\n      );\n      expect(tester.takeException(), isNull, reason: 'theme viewport: $size');"""
          new = """      SharedPreferences.setMockInitialValues({\n        'viewMode': 0,\n        'onboardingCheckpoint': 0,\n      });\n      tester.view.physicalSize = size;\n      await tester.pumpWidget(const SizedBox.shrink());\n      await tester.pump();\n      await tester.pumpWidget(\n        UntisPlusApp(startScreen: OnboardingFlow(key: ValueKey(size))),\n      );\n      await tester.pump(const Duration(milliseconds: 100));\n      expect(tester.takeException(), isNull, reason: 'welcome viewport: $size');\n\n      await tapVisible(tester, find.text('Weiter'));\n      final preview = find.byKey(const ValueKey('onboarding-theme-preview'));\n      await pumpUntilFound(tester, preview);\n      expect(preview, findsOneWidget);\n      expect(tester.takeException(), isNull, reason: 'theme viewport: $size');\n      final prefs = await SharedPreferences.getInstance();\n      await prefs.setInt('onboardingCheckpoint', 0);"""
          if source.count(old) != 1:
              raise SystemExit(f'onboarding viewport target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump(const Duration(milliseconds: 300));\n    await tester.tap(find.text('Weiter'));\n    await tester.pump(const Duration(milliseconds: 650));\n    await tester.tap(find.text('Weiter'));\n    await tester.pump(const Duration(milliseconds: 650));\n\n    final demoButton = find.text('Demo-Modus starten');\n    await tester.ensureVisible(demoButton);\n    await tester.tap(demoButton);\n    await tester.pump(const Duration(milliseconds: 650));\n\n    await tester.tap(find.text('Google Gemini'));\n    await tester.pump(const Duration(milliseconds: 400));\n    await tester.tap(find.text('Lokal (On-Device)'));\n    await tester.pump(const Duration(milliseconds: 450));"""
          new = """    final prefs = await SharedPreferences.getInstance();\n    await prefs.setInt('onboardingCheckpoint', 0);\n    await tester.pumpWidget(const UntisPlusApp(startScreen: OnboardingFlow()));\n    await tester.pump(const Duration(milliseconds: 100));\n\n    await tapVisible(tester, find.text('Weiter'));\n    await pumpUntilFound(\n      tester,\n      find.byKey(const ValueKey('onboarding-theme-default')),\n    );\n    await tapVisible(tester, find.text('Weiter'));\n\n    final demoButton = find.text('Demo-Modus starten');\n    await pumpUntilFound(tester, demoButton);\n    await tapVisible(tester, demoButton);\n    await pumpUntilFound(tester, find.text('Google Gemini'));\n\n    await tester.tap(find.text('Google Gemini'));\n    await pumpUntilFound(tester, find.text('Lokal (On-Device)'));\n    await tester.tap(find.text('Lokal (On-Device)'));\n    await pumpUntilFound(tester, find.text('Lokales Modell'));"""
          if source.count(old) != 1:
              raise SystemExit(f'local AI onboarding target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """      await tester.pump(const Duration(milliseconds: 600));\n      expect(\n        find.byKey(const ValueKey('day-timetable-carousel')),\n        findsOneWidget,\n        reason: 'day viewport: $size',\n      );"""
          new = """      final dayCarousel = find.byKey(const ValueKey('day-timetable-carousel'));\n      await pumpUntilFound(tester, dayCarousel);\n      expect(dayCarousel, findsOneWidget, reason: 'day viewport: $size');"""
          if source.count(old) != 1:
              raise SystemExit(f'weekly day wait target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """      await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n      await tester.pump(const Duration(milliseconds: 500));\n      expect(\n        find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n        findsOneWidget,\n        reason: 'week viewport: $size',\n      );"""
          new = """      await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n      final weekGrid = find.byKey(const ValueKey('week-grid-horizontal-scroll'));\n      await pumpUntilFound(tester, weekGrid);\n      expect(weekGrid, findsOneWidget, reason: 'week viewport: $size');"""
          if source.count(old) != 1:
              raise SystemExit(f'weekly grid wait target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    await tester.pump(const Duration(milliseconds: 600));\n    expect(find.byKey(const ValueKey('day-timetable-carousel')), findsOneWidget);"""
          new = """    await tester.pumpWidget(const UntisPlusApp(startScreen: WeeklyTimetablePage()));\n    final dayCarousel = find.byKey(const ValueKey('day-timetable-carousel'));\n    await pumpUntilFound(tester, dayCarousel);\n    expect(dayCarousel, findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'date carousel initial target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(\n      find.byKey(const ValueKey('week-grid-horizontal-scroll')),\n      findsOneWidget,\n    );\n    await tester.drag(\n      find.byKey(const ValueKey('week-grid-horizontal-scroll')),"""
          new = """    await tester.tap(find.byIcon(Icons.calendar_view_week_rounded));\n    final weekGrid = find.byKey(const ValueKey('week-grid-horizontal-scroll'));\n    await pumpUntilFound(tester, weekGrid);\n    expect(weekGrid, findsOneWidget);\n    await tester.drag(\n      weekGrid,"""
          if source.count(old) != 1:
              raise SystemExit(f'date weekly target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.tap(designEntry);\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byType(SettingsLessonDesignPage), findsOneWidget);"""
          new = """    await tester.tap(designEntry);\n    await pumpUntilFound(tester, find.byType(SettingsLessonDesignPage));\n    expect(find.byType(SettingsLessonDesignPage), findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'lesson navigation target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    tester.view.physicalSize = const Size(768, 1024);\n    await tester.pumpWidget(const UntisPlusApp(startScreen: SettingsHubPage()));\n    await tester.pump(const Duration(milliseconds: 400));"""
          new = """    tester.view.physicalSize = const Size(768, 1024);\n    await tester.pumpWidget(const SizedBox.shrink());\n    await tester.pump();\n    await tester.pumpWidget(const UntisPlusApp(startScreen: SettingsHubPage()));\n    await tester.pump(const Duration(milliseconds: 400));"""
          if source.count(old) != 1:
              raise SystemExit(f'compact fresh-root target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          old = """    await tester.tap(appearanceEntry);\n    await tester.pump(const Duration(milliseconds: 400));\n    expect(find.byType(SettingsAppearancePage), findsOneWidget);"""
          new = """    await tester.tap(appearanceEntry);\n    await pumpUntilFound(tester, find.byType(SettingsAppearancePage));\n    expect(find.byType(SettingsAppearancePage), findsOneWidget);"""
          if source.count(old) != 1:
              raise SystemExit(f'appearance navigation target count: {source.count(old)}')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

          theme_test = Path('test/app_theme_test.dart')
          theme_source = theme_test.read_text(encoding='utf-8')
          old = "expect(cyber.titleLarge?.fontFamily, contains('IBM Plex Mono'));"
          new = "expect(cyber.titleLarge?.fontFamily, startsWith('IBMPlexMono'));"
          if theme_source.count(old) != 1:
              raise SystemExit(f'font assertion target count: {theme_source.count(old)}')
          theme_test.write_text(theme_source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_remaining_widget_tests.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit remaining test fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart test/app_theme_test.dart
          git add -A .github/workflows
          git commit -m 'Fix remaining widget test races'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
