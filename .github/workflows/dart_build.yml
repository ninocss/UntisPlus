name: Flutter Release

# A release is the explicit publication boundary. Building from a pushed tag
# made accidental tags expensive and could publish an unfinished release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v5.6.0)'
        required: true
        type: string
      build_artifacts:
        description: 'Artifacts to attach to the existing GitHub release'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - apk+aab
      split_per_abi:
        description: 'Attach ABI-specific APKs in addition to the universal APK'
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: flutter-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  meta:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      build_apk: ${{ steps.meta.outputs.build_apk }}
      build_aab: ${{ steps.meta.outputs.build_aab }}
      split_per_abi: ${{ steps.meta.outputs.split_per_abi }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and validate release metadata
        id: meta
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event.release.name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_BUILD_ARTIFACTS: ${{ inputs.build_artifacts }}
          INPUT_SPLIT_PER_ABI: ${{ inputs.split_per_abi }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          tag="$(echo "$tag" | tr -d '[:space:]')"
          if [ -z "$tag" ] || ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "An existing Git tag is required: $tag"
            exit 1
          fi

          app_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [ -z "$app_version" ] || [ "${tag#v}" != "$app_version" ]; then
            echo "Release tag $tag must match pubspec.yaml version $app_version."
            exit 1
          fi
          if ! [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must use semantic versioning: $tag"
            exit 1
          fi

          artifacts="${INPUT_BUILD_ARTIFACTS:-apk}"
          build_apk=false
          build_aab=false
          case "$artifacts" in
            apk) build_apk=true ;;
            aab) build_aab=true ;;
            apk+aab) build_apk=true; build_aab=true ;;
            *) echo "Unsupported artifact selection: $artifacts"; exit 1 ;;
          esac

          split_per_abi="${INPUT_SPLIT_PER_ABI:-true}"
          if [ "$split_per_abi" != true ] && [ "$split_per_abi" != false ]; then
            split_per_abi=true
          fi

          version_code=1
          base_version="${app_version%%[-+]*}"
          if [[ "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r major minor patch <<< "$base_version"
            version_code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          fi

          release_name="${EVENT_NAME:-$tag}"
          {
            echo "release_tag=$tag"
            echo "release_name=$release_name"
            echo "build_apk=$build_apk"
            echo "build_aab=$build_aab"
            echo "split_per_abi=$split_per_abi"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Release summary
        run: |
          {
            echo '### Flutter Release'
            echo "- Tag: \`${{ steps.meta.outputs.release_tag }}\`"
            echo "- APK: ${{ steps.meta.outputs.build_apk }}"
            echo "- AAB: ${{ steps.meta.outputs.build_aab }}"
            echo "- ABI APKs: ${{ steps.meta.outputs.split_per_abi }}"
          } >> "$GITHUB_STEP_SUMMARY"

  quality_checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: meta
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test without the local AI native build
        run: |
          flutter analyze --no-fatal-infos
          pwsh -NoProfile -File tool/test_without_local_ai.ps1

  build_android:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [meta, quality_checks]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
          cache-dependency-path: pubspec.lock

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache fllama native builds
        uses: actions/cache@v6
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-android-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-fllama-android-

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo 'Android signing secrets are required for a release.'
            exit 1
          fi
          signing_dir="$RUNNER_TEMP/android-signing"
          mkdir -p "$signing_dir"
          echo "$KEYSTORE_BASE64" | base64 -d > "$signing_dir/upload-keystore.jks"
          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$signing_dir/upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build requested Android artifacts
        env:
          BUILD_APK: ${{ needs.meta.outputs.build_apk }}
          BUILD_AAB: ${{ needs.meta.outputs.build_aab }}
          SPLIT_PER_ABI: ${{ needs.meta.outputs.split_per_abi }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ "$BUILD_APK" = true ]; then
            flutter build apk --release --build-number="$VERSION_CODE"
            if [ "$SPLIT_PER_ABI" = true ]; then
              flutter build apk --release --split-per-abi --build-number="$VERSION_CODE"
            fi
          fi
          if [ "$BUILD_AAB" = true ]; then
            flutter build appbundle --release --build-number="$VERSION_CODE"
          fi

      - name: Prepare release assets
        env:
          BUILD_APK: ${{ needs.meta.outputs.build_apk }}
          BUILD_AAB: ${{ needs.meta.outputs.build_aab }}
          SPLIT_PER_ABI: ${{ needs.meta.outputs.split_per_abi }}
          TAG: ${{ needs.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p release_assets
          if [ "$BUILD_APK" = true ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "release_assets/UntisPlus-${TAG}-universal.apk"
            if [ "$SPLIT_PER_ABI" = true ]; then
              for abi in armeabi-v7a arm64-v8a x86_64; do
                cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release_assets/UntisPlus-${TAG}-${abi}.apk"
              done
            fi
            (
              cd release_assets
              sha256sum *.apk > SHA256SUMS.txt
              assets="$({
                for file in *.apk; do
                  abi=universal
                  case "$file" in
                    *-armeabi-v7a.apk) abi=armeabi-v7a ;;
                    *-arm64-v8a.apk) abi=arm64-v8a ;;
                    *-x86_64.apk) abi=x86_64 ;;
                  esac
                  jq -n --arg name "$file" --arg abi "$abi" --arg sha "$(sha256sum "$file" | awk '{print $1}')" --argjson size "$(stat -c%s "$file")" '{name: $name, abi: $abi, sha256: $sha, size_bytes: $size}'
                done
              } | jq -s '.')"
              jq -n --arg tag "$TAG" --arg version "${TAG#v}" --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson assets "$assets" '{tag: $tag, version: $version, generated_at: $generated_at, assets: $assets}' > release-manifest.json
            )
          fi
          if [ "$BUILD_AAB" = true ]; then
            cp build/app/outputs/bundle/release/app-release.aab "release_assets/UntisPlus-${TAG}.aab"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-release-assets
          path: release_assets/
          if-no-files-found: error

  release_notes:
    name: AI release notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: meta
    outputs:
      ai_notes: ${{ steps.notes.outputs.ai_notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes with a deterministic fallback
        id: notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_ref="$RELEASE_TAG"
          previous_tag="$(git describe --tags --abbrev=0 "${release_ref}^" 2>/dev/null || true)"
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$release_ref"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
          else
            range="$release_ref"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}"
          fi
          commits="$(git log "$range" --no-merges --pretty=format:'- %s' | head -n 100 || true)"
          if [ -n "$previous_tag" ]; then
            files="$(git diff --name-only "$range" | sort -u | head -n 180 || true)"
          else
            files="$(git log "$release_ref" -n 100 --no-merges --name-only --pretty=format:'' | sed '/^$/d' | sort -u | head -n 180 || true)"
          fi
          [ -n "${commits//[[:space:]]/}" ] || commits='- No non-merge commits were found in this range.'
          [ -n "${files//[[:space:]]/}" ] || files='(none)'

          fallback() {
            {
              echo "# Untis+ ${RELEASE_TAG#v}"
              echo
              echo '## Changes in this release'
              echo "$commits"
              echo
              echo '## Verification'
              echo '- Flutter analysis and the test suite ran before these assets were attached.'
              echo
              echo "**Full Changelog:** ${compare_url}"
            } > release_notes.md
          }

          if [ -z "$GEMINI_API_KEY" ]; then
            fallback
            echo 'ai_notes=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prompt=$(cat <<'EOF'
          Write concise, trustworthy GitHub release notes for the Flutter app Untis+.
          Return Markdown only. Use only the supplied commit subjects and changed paths; never infer an unproven feature or fix.

          Write in English for end users. Start with "# Untis+ <version>" and a one-paragraph practical summary.
          Add only sections that have evidence, in this order: "## Highlights", "## Improvements", "## Fixes", "## Performance & Reliability", "## Technical Notes".
          Put the most useful user-facing changes first. Every bullet must say what changed and where it matters. Keep internal work in Technical Notes, label it "Internal", and do not pad empty sections. Do not expose commit hashes or mention AI. End with the supplied Full Changelog link.
          EOF
          )
          payload="$(jq -n --arg prompt "$prompt" --arg version "${RELEASE_TAG#v}" --arg commits "$commits" --arg files "$files" --arg compare "$compare_url" '{contents:[{role:"user",parts:[{text:($prompt + "\n\nVersion: " + $version + "\n\nCommit subjects:\n" + $commits + "\n\nChanged paths:\n" + $files + "\n\nFull Changelog: " + $compare)}]}],generationConfig:{temperature:0.15,responseMimeType:"text/plain"}}')"
          request() { curl --fail-with-body -sS "https://generativelanguage.googleapis.com/v1beta/models/$1:generateContent?key=${GEMINI_API_KEY}" -H 'Content-Type: application/json' -d "$payload"; }
          extract() { jq -r '(.candidates[0].content.parts // [] | map(.text // empty) | join("\n")) // empty'; }
          response="$(request "$GEMINI_MODEL" || true)"
          body="$(echo "$response" | extract 2>/dev/null || true)"
          if [ -z "${body//[[:space:]]/}" ]; then
            response="$(request "$GEMINI_FALLBACK_MODEL" || true)"
            body="$(echo "$response" | extract 2>/dev/null || true)"
          fi
          if [ -z "${body//[[:space:]]/}" ]; then
            fallback
            echo 'ai_notes=false' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$body" > release_notes.md
            echo 'ai_notes=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error

  release:
    name: Attach assets to GitHub release
    runs-on: ubuntu-latest
    needs: [meta, quality_checks, build_android, release_notes]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-release-assets
          path: release_assets

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release_assets

      - name: Update the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ needs.meta.outputs.release_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" --notes-file release_assets/release_notes.md
          shopt -s nullglob
          assets=(release_assets/*)
          release_assets=()
          for asset in "${assets[@]}"; do
            [ "$(basename "$asset")" = release_notes.md ] || release_assets+=("$asset")
          done
          [ "${#release_assets[@]}" -gt 0 ]
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --clobber
