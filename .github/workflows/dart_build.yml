name: Manual Flutter Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
      release_name:
        description: 'Optionaler Release-Name (leer = Tag wird verwendet)'
        required: false
        type: string
      prerelease:
        description: 'Als Pre-Release markieren'
        required: true
        default: false
        type: boolean
      draft:
        description: 'Als Draft erstellen'
        required: true
        default: false
        type: boolean
      run_tests:
        description: 'flutter analyze und flutter test ausfuehren'
        required: true
        default: true
        type: boolean
      build_apk:
        description: 'Release-APK bauen'
        required: true
        default: true
        type: boolean
      build_aab:
        description: 'Release-AAB bauen'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze & Test
        if: ${{ inputs.run_tests }}
        run: |
          flutter analyze
          flutter test

      - name: Build Android APK
        if: ${{ inputs.build_apk }}
        run: flutter build apk --release

      - name: Build Android AAB
        if: ${{ inputs.build_aab }}
        run: flutter build appbundle --release

      - name: Generate Gemini Release Notes
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-2.0-flash
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY configured. Falling back to GitHub generated notes."
            echo "has_ai_notes=false" >> $GITHUB_OUTPUT
            echo "ai_reason=missing_api_key" >> $GITHUB_OUTPUT
            exit 0
          fi

          PREV_TAG=$(git tag --sort=-creatordate | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s (%h)' | head -n 120)
          else
            COMMITS=$(git log --pretty=format:'- %s (%h)' | head -n 120)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS='- No commit messages found.'
          fi

          PROMPT=$(cat <<'EOF'
          You are a release manager for a Flutter app.
          Create concise, user-friendly release notes in Markdown.
          Requirements:
          - Output in English.
          - Start with a short summary paragraph.
          - Then sections: "Highlights", "Improvements", "Fixes", "Technical Notes".
          - Use bullet points and include only changes that are inferable from commits.
          - If uncertain, phrase cautiously and do not invent details.
          - Keep it compact and readable for end users.
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg tag "$RELEASE_TAG" \
            --arg commits "$COMMITS" \
            '{
              contents: [
                {
                  role: "user",
                  parts: [
                    {
                      text: ($prompt + "\n\nRelease tag: " + $tag + "\n\nCommits:\n" + $commits)
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.2,
                responseMimeType: "text/plain"
              }
            }')

          request_model() {
            local model="$1"
            curl -sS "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          }

          extract_body() {
            jq -r '[
              (.candidates[0].content.parts // [] | map(.text // empty) | join("\n")),
              (.candidates // [] | map(.output_text // empty) | join("\n")),
              (.text // empty)
            ] | map(select(length > 0)) | .[0] // empty'
          }

          RESPONSE=$(request_model "$GEMINI_MODEL")
          API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          BODY=$(echo "$RESPONSE" | extract_body)

          USED_MODEL="$GEMINI_MODEL"
          if [ -n "$API_ERROR" ] || [ -z "$BODY" ]; then
            echo "Primary Gemini attempt failed (model=${GEMINI_MODEL}). Trying fallback model ${GEMINI_FALLBACK_MODEL}."
            RESPONSE=$(request_model "$GEMINI_FALLBACK_MODEL")
            API_ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
            BODY=$(echo "$RESPONSE" | extract_body)
            USED_MODEL="$GEMINI_FALLBACK_MODEL"
          fi

          BLOCK_REASON=$(echo "$RESPONSE" | jq -r '.promptFeedback.blockReason // empty')
          FINISH_REASON=$(echo "$RESPONSE" | jq -r '.candidates[0].finishReason // empty')
          RESPONSE_SNIPPET=$(echo "$RESPONSE" | jq -c '{error: .error, promptFeedback: .promptFeedback, finishReason: .candidates[0].finishReason}' | head -c 800)

          {
            echo "gemini_used_model=$USED_MODEL"
            echo "gemini_block_reason=${BLOCK_REASON:-none}"
            echo "gemini_finish_reason=${FINISH_REASON:-none}"
            echo "gemini_response_snippet=${RESPONSE_SNIPPET:-n/a}"
          } >> $GITHUB_OUTPUT

          if [ -n "$API_ERROR" ]; then
            echo "Gemini API returned an error: $API_ERROR"
            echo "has_ai_notes=false" >> $GITHUB_OUTPUT
            echo "ai_reason=gemini_api_error" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ -z "$BODY" ]; then
            echo "AI note generation failed. Falling back to GitHub generated notes."
            echo "has_ai_notes=false" >> $GITHUB_OUTPUT
            if [ -n "$BLOCK_REASON" ]; then
              echo "ai_reason=gemini_blocked_${BLOCK_REASON}" >> $GITHUB_OUTPUT
            else
              echo "ai_reason=empty_gemini_response" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          printf '%s\n' "$BODY" > gemini_release_notes.md

          {
            echo "release_notes_path=gemini_release_notes.md"
            echo "ai_reason=success"
          } >> $GITHUB_OUTPUT
          echo "has_ai_notes=true" >> $GITHUB_OUTPUT

      - name: Release Notes Summary
        if: always()
        run: |
          echo "### Gemini Release Notes" >> $GITHUB_STEP_SUMMARY
          echo "- enabled: ${{ steps.ai_notes.outputs.has_ai_notes }}" >> $GITHUB_STEP_SUMMARY
          echo "- reason: ${{ steps.ai_notes.outputs.ai_reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- model_used: ${{ steps.ai_notes.outputs.gemini_used_model }}" >> $GITHUB_STEP_SUMMARY
          echo "- block_reason: ${{ steps.ai_notes.outputs.gemini_block_reason }}" >> $GITHUB_STEP_SUMMARY
          echo "- finish_reason: ${{ steps.ai_notes.outputs.gemini_finish_reason }}" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.ai_notes.outputs.gemini_response_snippet }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Response diagnostics:" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.ai_notes.outputs.gemini_response_snippet }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.ai_notes.outputs.has_ai_notes }}" = "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Preview:" >> $GITHUB_STEP_SUMMARY
            echo '```markdown' >> $GITHUB_STEP_SUMMARY
            sed -n '1,30p' "${{ steps.ai_notes.outputs.release_notes_path }}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create GitHub Release (AI Notes)
        if: ${{ steps.ai_notes.outputs.has_ai_notes == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          body_path: ${{ steps.ai_notes.outputs.release_notes_path }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (Fallback)
        if: ${{ steps.ai_notes.outputs.has_ai_notes != 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}