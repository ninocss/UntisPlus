name: Flutter Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '🏷️ Release Tag (leer = Version aus pubspec.yaml, z.B. v5.2.0)'
        required: false
        default: ''
        type: string
      release_name:
        description: '📝 Optionaler Release-Name (leer = Tag wird verwendet)'
        required: false
        type: string
      prerelease:
        description: '🧪 Als Pre-Release markieren'
        required: true
        default: false
        type: boolean
      draft:
        description: '📌 Als Draft (Entwurf) erstellen'
        required: true
        default: false
        type: boolean
      run_tests:
        description: '🔍 Qualitätsprüfungen ausführen (flutter analyze & test)'
        required: true
        default: true
        type: boolean
      use_fllama_cache:
        description: '⚡ fllama Native Build Cache verwenden'
        required: true
        default: true
        type: boolean
      build_artifacts:
        description: '📦 Welche Artefakte sollen gebaut werden?'
        required: true
        default: 'apk+ipa'
        type: choice
        options:
          - apk
          - aab
          - apk+aab
          - ipa
          - apk+ipa
          - none
      split_per_abi:
        description: '📱 APK per ABI splitten (armeabi-v7a, arm64-v8a, x86_64)'
        required: true
        default: true
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: ⚙️ Metadata & Config
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      run_tests: ${{ steps.meta.outputs.run_tests }}
      use_fllama_cache: ${{ steps.meta.outputs.use_fllama_cache }}
      build_apk: ${{ steps.meta.outputs.build_apk }}
      build_aab: ${{ steps.meta.outputs.build_aab }}
      build_ipa: ${{ steps.meta.outputs.build_ipa }}
      split_per_abi: ${{ steps.meta.outputs.split_per_abi }}
      last_semver_tag: ${{ steps.meta.outputs.last_semver_tag }}
      app_version: ${{ steps.meta.outputs.app_version }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - name: Checkout Repository (Full depth for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Release Metadata
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_RUN_TESTS: ${{ github.event.inputs.run_tests }}
          INPUT_USE_FLLAMA_CACHE: ${{ github.event.inputs.use_fllama_cache }}
          INPUT_BUILD_ARTIFACTS: ${{ github.event.inputs.build_artifacts }}
          INPUT_SPLIT_PER_ABI: ${{ github.event.inputs.split_per_abi }}
        run: |
          set -euo pipefail

          normalize_bool() {
            local v="${1:-}"
            local fallback="${2:-false}"
            if [ "$v" = "true" ] \vert{}\vert{} [ "$v" = "false" ]; then
              echo "$v"
            else
              echo "$fallback"
            fi
          }

          input_tag="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            input_tag="${GITHUB_REF_NAME}"
          fi

          last_tag="$(git tag --list \vert{} grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          app_version="$(grep -E '^version:\s*' pubspec.yaml | head -n 1 | sed -E 's/^version:\s*//' | sed -E 's/[[:space:]]*\+.*//')"
          if [ -z "$app_version" ]; then
            echo 'pubspec.yaml has no valid version.'
            exit 1
          fi

          resolved_tag="$input_tag"
          if [ -z "$resolved_tag" ]; then
            resolved_tag="v$app_version"
          fi
          if ! [[ "$resolved_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic: $resolved_tag"
            exit 1
          fi
          if [ "${resolved_tag#v}" != "$app_version" ]; then
            echo "Release tag $resolved_tag does not match pubspec.yaml version$app_version."
            exit 1
          fi

          resolved_name="$(echo "${INPUT_RELEASE_NAME:-}" \vert{} sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "$resolved_name" ]; then
            resolved_name="$resolved_tag"
          fi

          prerelease="$(normalize_bool "${INPUT_PRERELEASE:-}" "false")"
          draft="$(normalize_bool "${INPUT_DRAFT:-}" "false")"
          run_tests="$(normalize_bool "${INPUT_RUN_TESTS:-}" "true")"
          if [ "$run_tests" != "true" ]; then
            echo 'Quality checks are mandatory for published releases; forcing run_tests=true.'
            run_tests="true"
          fi
          split_per_abi="$(normalize_bool "${INPUT_SPLIT_PER_ABI:-}" "true")"
          use_fllama_cache="$(normalize_bool "${INPUT_USE_FLLAMA_CACHE:-}" "true")"

          build_artifacts="$(echo "${INPUT_BUILD_ARTIFACTS:-apk}" | tr -d '[:space:]')"
          build_apk="false"
          build_aab="false"
          build_ipa="false"
          case "$build_artifacts" in
            apk) build_apk="true" ;;
            aab) build_aab="true" ;;
            apk+aab) build_apk="true"; build_aab="true" ;;
            ipa) build_ipa="true" ;;
            apk+ipa) build_apk="true"; build_ipa="true" ;;
            none) ;;
            *) build_apk="true" ;;
          esac

          version_code="1"
          if [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IFS='.' read -r v_major v_minor v_patch <<< "$app_version"
            version_code=$((10#$v_major * 10000 + 10#$v_minor * 100 + 10#$v_patch))
          fi

          {
            echo "release_tag=$resolved_tag"
            echo "release_name=$resolved_name"
            echo "prerelease=$prerelease"
            echo "draft=$draft"
            echo "run_tests=$run_tests"
            echo "use_fllama_cache=$use_fllama_cache"
            echo "build_apk=$build_apk"
            echo "build_aab=$build_aab"
            echo "build_ipa=$build_ipa"
            echo "split_per_abi=$split_per_abi"
            echo "last_semver_tag=$last_tag"
            echo "app_version=$app_version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Summary UX
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Release Configuration
          | Key | Value |
          |---|---|
          | **Tag** | \`${{ steps.meta.outputs.release_tag }}\` |
          | **Name** | \`${{ steps.meta.outputs.release_name }}\` |
          | **App Version** | \`${{ steps.meta.outputs.app_version }}\` |
          | **Version Code** | \`${{ steps.meta.outputs.version_code }}\` |
          | **Build APK** | \`${{ steps.meta.outputs.build_apk }}\` |
          | **Build AAB** | \`${{ steps.meta.outputs.build_aab }}\` |
          | **Build IPA** | \`${{ steps.meta.outputs.build_ipa }}\` |
          | **Pre-Release** | \`${{ steps.meta.outputs.prerelease }}\` |
          | **Draft** | \`${{ steps.meta.outputs.draft }}\` |
          EOF

  quality_checks:
    name: 🧪 Analyze & Tests
    runs-on: ubuntu-latest
    needs: meta
    if: ${{ needs.meta.outputs.run_tests == 'true' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache fllama native builds
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-linux-${{ hashFiles('pubspec.lock') }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze & Test
        run: |
          flutter analyze --no-fatal-infos
          pwsh -NoProfile -File tool/test_without_local_ai.ps1

  build_apk:
    name: 🤖 Build APK
    runs-on: ubuntu-latest
    needs: [meta, quality_checks]
    if: ${{ always() && needs.meta.outputs.build_apk == 'true' && needs.meta.result == 'success' && (needs.quality_checks.result == 'success' || needs.quality_checks.result == 'skipped') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache fllama native builds
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-android-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] \vert{}\vert{} [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] \vert{}\vert{} [ -z "$KEY_PASSWORD" ]; then
            echo "Android signing secrets are required for release."
            exit 1
          fi
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "storePassword=$KEY_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: |
          flutter build apk --release --build-number=${{ needs.meta.outputs.version_code }}
          mkdir -p universal_apk
          cp build/app/outputs/flutter-apk/app-release.apk universal_apk/
          if [ "${{ needs.meta.outputs.split_per_abi }}" = "true" ]; then
            flutter build apk --release --split-per-abi --build-number=${{ needs.meta.outputs.version_code }}
          fi

      - name: Prepare APK Artifacts & Manifest
        run: |
          mkdir -p apk_artifacts
          TAG="${{ needs.meta.outputs.release_tag }}"
          
          cp universal_apk/app-release.apk "apk_artifacts/UntisPlus-${TAG}-universal.apk"
          if [ "${{ needs.meta.outputs.split_per_abi }}" = "true" ]; then
            for abi in armeabi-v7a arm64-v8a x86_64; do
              source="build/app/outputs/flutter-apk/app-${abi}-release.apk"
              if [ -f "$source" ]; then
                cp "$source" "apk_artifacts/UntisPlus-${TAG}-${abi}.apk"
              fi
            done
          fi

          (
            cd apk_artifacts
            sha256sum *.apk > SHA256SUMS.txt
            assets="$({
              for f in *.apk; do
                abi="universal"
                case "$f" in
                  *-armeabi-v7a.apk) abi="armeabi-v7a" ;;
                  *-arm64-v8a.apk) abi="arm64-v8a" ;;
                  *-x86_64.apk) abi="x86_64" ;;
                esac
                jq -n --arg name "$f" --arg abi "$abi" \
                  --arg sha "$(sha256sum "$f" | awk '{print $1}')" \
                  --argjson size "$(stat -c\%s "$f")" \
                  '{name: $name, abi:$abi, sha256: $sha, size_bytes:$size}'
              done
            } | jq -s '.')"
            jq -n \
              --arg tag "$TAG" \
              --arg version "${TAG#v}" \
              --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson assets "$assets" \
              '{tag: $tag, version:$version, generated_at: $generated_at, assets:$assets}' \
              > release-manifest.json
          )

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: apk_artifacts/
          if-no-files-found: error

      - name: APK Summary UX
        run: |
          echo "### 📱 Built APKs" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          cd apk_artifacts
          for f in *.apk; do
            size=$(du -h "$f" | cut -f1)
            sha=$(sha256sum "$f" | cut -c1-12)
            echo "| \`$f\` | $size | \`$sha...\` |" >> $GITHUB_STEP_SUMMARY
          done

  build_aab:
    name: 📦 Build AAB
    runs-on: ubuntu-latest
    needs: [meta, quality_checks]
    if: ${{ always() && needs.meta.outputs.build_aab == 'true' && needs.meta.result == 'success' && (needs.quality_checks.result == 'success' || needs.quality_checks.result == 'skipped') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache fllama native builds
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-android-${{ hashFiles('pubspec.lock') }}

      - name: Configure Android Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] \vert{}\vert{} [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] \vert{}\vert{} [ -z "$KEY_PASSWORD" ]; then
            echo "Android signing secrets are required for release."
            exit 1
          fi
          mkdir -p android
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          echo "storePassword=$KEY_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android AAB
        run: flutter build appbundle --release --build-number=${{ needs.meta.outputs.version_code }}

      - name: Prepare AAB Artifact
        run: |
          mkdir -p aab_artifacts
          TAG="${{ needs.meta.outputs.release_tag }}"
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp "build/app/outputs/bundle/release/app-release.aab" "aab_artifacts/UntisPlus-${TAG}.aab"
          fi

      - name: Upload AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: aab_artifacts/
          if-no-files-found: error

  build_ipa:
    name: 🍏 Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    needs: [meta, quality_checks]
    if: ${{ always() && needs.meta.outputs.build_ipa == 'true' && needs.meta.result == 'success' && (needs.quality_checks.result == 'success' || needs.quality_checks.result == 'skipped') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Cache fllama native builds
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-ios-${{ hashFiles('pubspec.lock') }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          TAG="${{ needs.meta.outputs.release_tag }}"
          mkdir -p ipa_artifacts Payload
          ditto --norsrc build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -r "ipa_artifacts/UntisPlus-${TAG}.ipa" Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: ipa_artifacts/
          if-no-files-found: error

  release_notes:
    name: 🤖 Gemini Release Notes
    runs-on: ubuntu-latest
    needs: [meta, quality_checks]
    if: ${{ always() && needs.meta.result == 'success' && (needs.quality_checks.result == 'success' || needs.quality_checks.result == 'skipped') }}
    outputs:
      has_ai_notes: ${{ steps.ai_notes.outputs.has_ai_notes }}
    steps:
      - name: Checkout Repository (Full depth for logs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Gemini Release Notes
        id: ai_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GEMINI_FALLBACK_MODEL: gemini-2.5-flash-lite
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
        run: |
          set -euo pipefail

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_ai_notes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          APP_VERSION=$(grep -E '^version:\s*' pubspec.yaml | head -n 1 | sed -E 's/^version:\s*//')
          PREV_TAG=$(git tag --sort=-creatordate | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
          REPO_SLUG="${GITHUB_REPOSITORY:-}"

          if [ -n "$REPO_SLUG" ] && [ -n "$PREV_TAG" ]; then
            COMPARE_URL="https://github.com/${REPO_SLUG}/compare/${PREV_TAG}...${RELEASE_TAG}"
          else
            COMPARE_URL=""
          fi

          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            COMMIT_COUNT=$(git rev-list --count "$RANGE" 2>/dev/null || echo "0")
            COMMITS=$(git log "$RANGE" -n 80 --no-merges --pretty=format:'- %s (%h)' --name-only)
            CHANGED_FILES=$(git diff --name-only "$RANGE" | head -n 220 || true)
          else
            COMMIT_COUNT=$(git rev-list --max-count=80 --count HEAD 2>/dev/null || echo "0")
            COMMITS=$(git log -n 80 --no-merges --pretty=format:'- %s (%h)' --name-only)
            CHANGED_FILES=$(git log -n 80 --no-merges --name-only --pretty=format:'' \vert{} sed '/^$/d' | sort -u | head -n 220 || true)
          fi

          PROMPT=$(cat <<'EOF'
          You are a release manager writing release notes for a Flutter app.
          Produce detailed, high-signal release notes.

          Rules:
          - Output in English. Valid Markdown only.
          - Use ONLY information inferable from provided commits/files.
          - Do NOT invent features. Friendly tone for a hobby project.
          - Format: Title "Release <tag>", short summary, H2 sections (Highlights, What's New, Improvements, Fixes, Technical Notes), link to Full Changelog if compare URL provided.
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg tag "$RELEASE_TAG" \
            --arg prev_tag "${PREV_TAG:-}" \
            --arg app_version "${APP_VERSION:-}" \
            --arg commit_count "$COMMIT_COUNT" \
            --arg compare_url "$COMPARE_URL" \
            --arg changed_files "$CHANGED_FILES" \
            --arg commits "$COMMITS" \
            '{
              contents: [{
                role: "user",
                parts: [{
                  text: ($prompt + "\n\nContext:\n- Tag: " + $tag + "\n- App version: " + $app_version + "\n- Commits: " + $commit_count + "\n\nFiles:\n" + $changed_files + "\n\nCommits:\n" + $commits)
                }]
              }],
              generationConfig: { temperature: 0.2 }
            }')

          request_model() {
            local model="$1"
            curl -sS "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          }

          RESPONSE=$(request_model "$GEMINI_MODEL")
          BODY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')

          if [ -z "$BODY" ]; then
            RESPONSE=$(request_model "$GEMINI_FALLBACK_MODEL")
            BODY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          fi

          if [ -n "$BODY" ]; then
            printf '%s\n' "$BODY" > gemini_release_notes.md
            echo "has_ai_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_ai_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Fallback Notes
        if: ${{ steps.ai_notes.outputs.has_ai_notes != 'true' }}
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)
          RANGE="${PREV_TAG}..HEAD"
          [ -z "$PREV_TAG" ] && RANGE="HEAD"

          {
            echo "# Release $RELEASE_TAG"
            echo
            echo "## Changes"
            git log "$RANGE" --no-merges --pretty=format:'- %s' | head -n 80
            echo
            echo "## Verification"
            echo "- Ran Flutter analysis and tests in release workflow."
          } > fallback_release_notes.md

      - name: Select Release Notes
        run: |
          if [ "${{ steps.ai_notes.outputs.has_ai_notes }}" = "true" ]; then
            cp gemini_release_notes.md release_notes.md
          else
            cp fallback_release_notes.md release_notes.md
          fi

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

      - name: Release Notes Summary UX
        run: |
          echo "### 📝 Generated Release Notes Preview" >> $GITHUB_STEP_SUMMARY
          echo '```markdown' >> $GITHUB_STEP_SUMMARY
          cat release_notes.md | head -n 30 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    name: 🎉 GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [meta, quality_checks, build_apk, build_aab, build_ipa, release_notes]
    if: ${{ always() && needs.meta.result == 'success' && (needs.quality_checks.result == 'success' || needs.quality_checks.result == 'skipped') && (needs.build_apk.result == 'success' || needs.build_apk.result == 'skipped') && (needs.build_aab.result == 'success' || needs.build_aab.result == 'skipped') && (needs.build_ipa.result == 'success' || needs.build_ipa.result == 'skipped') && (needs.release_notes.result == 'success' || needs.release_notes.result == 'skipped') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "SHA256SUMS.txt" -o -name "release-manifest.json" \) -exec cp {} release_assets/ \;

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.release_tag }}
          NAME: ${{ needs.meta.outputs.release_name }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          DRAFT: ${{ needs.meta.outputs.draft }}
        run: |
          NOTES_FILE="downloaded_artifacts/release-notes/release_notes.md"
          
          OPTS=()
          [ "$PRERELEASE" = "true" ] && OPTS+=("--prerelease")
          [ "$DRAFT" = "true" ] && OPTS+=("--draft")
          [ -f "$NOTES_FILE" ] && OPTS+=("--notes-file" "$NOTES_FILE")

          gh release create "$TAG" release_assets/* \
            --title "$NAME" \
            "${OPTS[@]}"

      - name: Final Summary UX
        run: |
          echo "## 🎉 Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "Tag: **${{ needs.meta.outputs.release_tag }}**" >> $GITHUB_STEP_SUMMARY
