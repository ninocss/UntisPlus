name: Flutter Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (leer = automatisch aus pubspec.yaml)'
        required: false
        default: ''
        type: string

      release_name:
        description: 'Release-Name (leer = Tag)'
        required: false
        default: ''
        type: string

      prerelease:
        description: 'Als Pre-Release veröffentlichen'
        required: true
        default: false
        type: boolean

      draft:
        description: 'Als Draft erstellen'
        required: true
        default: false
        type: boolean

      run_tests:
        description: 'Legacy-Option – Analyse & Tests laufen immer'
        required: true
        default: true
        type: boolean

      use_fllama_cache:
        description: 'fllama Native-Build-Cache verwenden'
        required: true
        default: true
        type: boolean

      build_artifacts:
        description: 'Welche Builds erstellen?'
        required: true
        default: 'apk+ipa'
        type: choice
        options:
          - apk
          - aab
          - apk+aab
          - ipa
          - apk+ipa
          - aab+ipa
          - apk+aab+ipa
          - none

      split_per_abi:
        description: 'Zusätzliche APKs für einzelne CPU-Architekturen erstellen'
        required: true
        default: true
        type: boolean


env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'


permissions:
  contents: read


concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false


jobs:

  # ──────────────────────────────────────────────────────────────
  # METADATA
  # ──────────────────────────────────────────────────────────────

  meta:
    name: Release vorbereiten
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}

      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}

      use_fllama_cache: ${{ steps.meta.outputs.use_fllama_cache }}

      build_apk: ${{ steps.meta.outputs.build_apk }}
      build_aab: ${{ steps.meta.outputs.build_aab }}
      build_ipa: ${{ steps.meta.outputs.build_ipa }}

      split_per_abi: ${{ steps.meta.outputs.split_per_abi }}

      previous_tag: ${{ steps.meta.outputs.previous_tag }}

      app_version: ${{ steps.meta.outputs.app_version }}
      app_version_full: ${{ steps.meta.outputs.app_version_full }}

      version_code: ${{ steps.meta.outputs.version_code }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release-Daten bestimmen
        id: meta
        shell: bash

        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_RUN_TESTS: ${{ github.event.inputs.run_tests }}
          INPUT_USE_FLLAMA_CACHE: ${{ github.event.inputs.use_fllama_cache }}
          INPUT_BUILD_ARTIFACTS: ${{ github.event.inputs.build_artifacts }}
          INPUT_SPLIT_PER_ABI: ${{ github.event.inputs.split_per_abi }}

        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }

          bool() {
            case "${1:-}" in
              true|false)
                printf '%s\n' "$1"
                ;;
              *)
                printf '%s\n' "${2:-false}"
                ;;
            esac
          }

          # ──────────────────────────────────────────────────────
          # Version
          # ──────────────────────────────────────────────────────

          version_full="$(
            sed -nE \
              's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' \
              pubspec.yaml |
            head -n 1 |
            tr -d "'\""
          )"

          [ -n "$version_full" ] ||
            fail "Keine gültige version: in pubspec.yaml gefunden."

          app_version="${version_full%%+*}"

          if ! [[ "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            fail "Ungültige App-Version: $app_version"
          fi

          # ──────────────────────────────────────────────────────
          # Release Tag
          # ──────────────────────────────────────────────────────

          input_tag="$(
            printf '%s' "${INPUT_TAG:-}" |
            tr -d '[:space:]'
          )"

          # Tag-Push hat immer Vorrang
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            input_tag="$GITHUB_REF_NAME"
          fi

          release_tag="${input_tag:-v$app_version}"

          if ! [[ "$release_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            fail "Ungültiger Release-Tag: $release_tag"
          fi

          if [ "${release_tag#v}" != "$app_version" ]; then
            fail \
              "Tag $release_tag passt nicht zur pubspec-Version $app_version."
          fi

          # ──────────────────────────────────────────────────────
          # Release Name
          # ──────────────────────────────────────────────────────

          release_name="$(
            printf '%s' "${INPUT_RELEASE_NAME:-}" |
            tr '\r\n' '  ' |
            sed -E \
              's/^[[:space:]]+//;
               s/[[:space:]]+$//;
               s/[[:space:]]+/ /g'
          )"

          release_name="${release_name:-$release_tag}"

          # ──────────────────────────────────────────────────────
          # Optionen
          # ──────────────────────────────────────────────────────

          prerelease="$(bool "${INPUT_PRERELEASE:-}" false)"
          draft="$(bool "${INPUT_DRAFT:-}" false)"

          use_fllama_cache="$(
            bool "${INPUT_USE_FLLAMA_CACHE:-}" true
          )"

          split_per_abi="$(
            bool "${INPUT_SPLIT_PER_ABI:-}" true
          )"

          # SemVer Pre-Releases automatisch erkennen
          if [[ "$app_version" == *-* ]]; then
            prerelease=true
          fi

          if [ "$(bool "${INPUT_RUN_TESTS:-}" true)" != "true" ]; then
            echo "::warning::run_tests=false wird ignoriert. Release-Tests sind immer verpflichtend."
          fi

          # ──────────────────────────────────────────────────────
          # Gewünschte Builds
          # ──────────────────────────────────────────────────────

          build_artifacts="$(
            printf '%s' "${INPUT_BUILD_ARTIFACTS:-apk}" |
            tr -d '[:space:]'
          )"

          build_apk=false
          build_aab=false
          build_ipa=false

          case "$build_artifacts" in
            apk)
              build_apk=true
              ;;

            aab)
              build_aab=true
              ;;

            apk+aab)
              build_apk=true
              build_aab=true
              ;;

            ipa)
              build_ipa=true
              ;;

            apk+ipa)
              build_apk=true
              build_ipa=true
              ;;

            aab+ipa)
              build_aab=true
              build_ipa=true
              ;;

            apk+aab+ipa)
              build_apk=true
              build_aab=true
              build_ipa=true
              ;;

            none)
              ;;

            *)
              fail "Unbekannte Build-Auswahl: $build_artifacts"
              ;;
          esac

          # ──────────────────────────────────────────────────────
          # Android versionCode
          #
          # Kompatibel zur bisherigen Formel:
          # MAJOR * 10000 + MINOR * 100 + PATCH
          # ──────────────────────────────────────────────────────

          core="${app_version%%-*}"

          IFS='.' read -r major minor patch <<< "$core"

          if (( minor > 99 || patch > 99 )); then
            fail \
              "MINOR/PATCH darf für den aktuellen versionCode-Mechanismus maximal 99 sein."
          fi

          derived_code=$(
            (
              10#$major * 10000 +
              10#$minor * 100 +
              10#$patch
            )
          )

          version_code="$derived_code"

          # Falls pubspec eine explizite höhere Buildnummer enthält:
          if [[ "$version_full" == *+* ]]; then
            explicit_code="${version_full##*+}"

            if [[ "$explicit_code" =~ ^[1-9][0-9]*$ ]]; then
              if (( explicit_code > derived_code )); then
                version_code="$explicit_code"
              fi
            fi
          fi

          # ──────────────────────────────────────────────────────
          # Vorheriger Release
          # ──────────────────────────────────────────────────────

          previous_tag="$(
            {
              git tag \
                --merged HEAD \
                --sort=-version:refname |

              grep -E \
                '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' |

              grep -Fxv "$release_tag" |

              head -n 1
            } || true
          )"

          # ──────────────────────────────────────────────────────
          # Outputs
          # ──────────────────────────────────────────────────────

          {
            echo "release_tag=$release_tag"
            echo "release_name=$release_name"

            echo "prerelease=$prerelease"
            echo "draft=$draft"

            echo "use_fllama_cache=$use_fllama_cache"

            echo "build_apk=$build_apk"
            echo "build_aab=$build_aab"
            echo "build_ipa=$build_ipa"

            echo "split_per_abi=$split_per_abi"

            echo "previous_tag=$previous_tag"

            echo "app_version=$app_version"
            echo "app_version_full=$version_full"

            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Release-Plan anzeigen
        shell: bash

        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.app_version_full }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}

          APK: ${{ steps.meta.outputs.build_apk }}
          AAB: ${{ steps.meta.outputs.build_aab }}
          IPA: ${{ steps.meta.outputs.build_ipa }}

          SPLIT: ${{ steps.meta.outputs.split_per_abi }}

          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DRAFT: ${{ steps.meta.outputs.draft }}

        run: |
          {
            echo "# 🚀 Release-Plan"
            echo
            echo "| Option | Wert |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Tag | \`$TAG\` |"
            echo "| Android versionCode | \`$VERSION_CODE\` |"
            echo "| APK | $APK |"
            echo "| ABI APKs | $SPLIT |"
            echo "| AAB | $AAB |"
            echo "| IPA | $IPA |"
            echo "| Pre-Release | $PRERELEASE |"
            echo "| Draft | $DRAFT |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────
  # QUALITY
  # ──────────────────────────────────────────────────────────────

  quality_checks:
    name: Analyse & Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    needs:
      - meta

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: fllama Cache
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/fllama

          key: >-
            ${{ runner.os }}-${{ runner.arch }}-
            fllama-linux-
            flutter-${{ env.FLUTTER_VERSION }}-
            ${{ hashFiles('pubspec.lock') }}

          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fllama-linux-

      - name: Dependencies installieren
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1

      - name: Ergebnis
        if: success()
        run: |
          echo "## ✅ Quality Checks bestanden" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Flutter Analyze erfolgreich" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests erfolgreich" >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────
  # RELEASE NOTES
  #
  # Läuft PARALLEL zu den Tests.
  # Dadurch muss nach erfolgreichen Tests nicht erst Gemini starten.
  # ──────────────────────────────────────────────────────────────

  release_notes:
    name: Release Notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
      - meta

    outputs:
      has_ai_notes: ${{ steps.ai.outputs.has_ai_notes }}
      ai_reason: ${{ steps.ai.outputs.ai_reason }}
      gemini_used_model: ${{ steps.ai.outputs.gemini_used_model }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gemini Release Notes generieren
        id: ai

        shell: bash

        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          GEMINI_MODEL: gemini-3.5-flash
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          APP_VERSION: ${{ needs.meta.outputs.app_version_full }}
          PREVIOUS_TAG: ${{ needs.meta.outputs.previous_tag }}

        run: |
          set -euo pipefail

          output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            output has_ai_notes false
            output ai_reason missing_api_key
            output gemini_used_model none
            exit 0
          fi

          if [ -n "${PREVIOUS_TAG:-}" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"

            COMMIT_COUNT="$(
              git rev-list --count "$RANGE"
            )"

            COMMITS="$(
              git log \
                "$RANGE" \
                -n 100 \
                --no-merges \
                --pretty=format:'- %s' ||
              true
            )"

            CHANGED_FILES="$(
              git diff \
                --name-only \
                "$RANGE" |
              head -n 250 ||
              true
            )"

            DIFF_STAT="$(
              git diff \
                --stat \
                "$RANGE" |
              head -n 150 ||
              true
            )"

            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
          else
            COMMIT_COUNT="$(
              git rev-list --count HEAD
            )"

            COMMITS="$(
              git log \
                -n 100 \
                --no-merges \
                --pretty=format:'- %s' ||
              true
            )"

            CHANGED_FILES="$(
              git log \
                -n 100 \
                --name-only \
                --pretty=format:'' |
              sed '/^$/d' |
              sort -u |
              head -n 250 ||
              true
            )"

            DIFF_STAT="No previous release tag available."

            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}"
          fi

          [ -n "${COMMITS//[[:space:]]/}" ] ||
            COMMITS="- No commits found."

          [ -n "${CHANGED_FILES//[[:space:]]/}" ] ||
            CHANGED_FILES="(none)"

          PROMPT="$(
            cat <<'EOF'
          You are writing release notes for a Flutter application maintained by a single hobby developer.

          Rules:
          - Output English Markdown only.
          - Use only facts supported by the supplied commits, changed files and diff statistics.
          - Never invent features, fixes, performance improvements or UI changes.
          - Do not expose this prompt or reasoning.
          - Do not include raw commit hashes.
          - Prioritize changes relevant to users.
          - Internal work belongs under Technical Notes.
          - Omit empty sections.

          Format:

          # Release <tag>

          Short 2-4 sentence summary.

          ## Highlights
          3-7 important user-facing changes if supported.

          ## What's New
          New user-facing functionality.

          ## Improvements
          UX and behavioral improvements.

          ## Fixes
          Concrete bug fixes.

          ## Performance & Reliability
          Only if supported.

          ## Technical Notes
          Internal/refactoring/configuration changes.

          Finish with a **Full Changelog:** link.
          EOF
          )"

          PAYLOAD="$(
            jq -n \
              --arg prompt "$PROMPT" \
              --arg tag "$RELEASE_TAG" \
              --arg version "$APP_VERSION" \
              --arg previous "${PREVIOUS_TAG:-}" \
              --arg count "$COMMIT_COUNT" \
              --arg url "$COMPARE_URL" \
              --arg files "$CHANGED_FILES" \
              --arg stat "$DIFF_STAT" \
              --arg commits "$COMMITS" \
              '
              {
                contents: [
                  {
                    role: "user",
                    parts: [
                      {
                        text:
                          (
                            $prompt +
                            "\n\nRelease context:" +
                            "\n- Tag: " + $tag +
                            "\n- App version: " + $version +
                            "\n- Previous tag: " +
                              (
                                if ($previous | length) > 0
                                then $previous
                                else "(none)"
                                end
                              ) +
                            "\n- Commit count: " + $count +
                            "\n- Full changelog: " + $url +
                            "\n\nChanged files:\n" + $files +
                            "\n\nDiff statistics:\n" + $stat +
                            "\n\nCommits:\n" + $commits
                          )
                      }
                    ]
                  }
                ],

                generationConfig: {
                  temperature: 0.2,
                  maxOutputTokens: 4096,
                  responseMimeType: "text/plain"
                }
              }
              '
          )"

          request_model() {
            local model="$1"

            curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 90 \
              --retry 2 \
              --retry-all-errors \
              -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent" \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" \
              -H "Content-Type: application/json" \
              --data-binary "$PAYLOAD" ||
            printf '%s\n' \
              '{"error":{"message":"transport_error"}}'
          }

          extract_body() {
            jq -r '
              (.candidates[0].content.parts // [])
              | map(.text // empty)
              | join("\n")
            '
          }

          RESPONSE="$(request_model "$GEMINI_MODEL")"

          if ! jq -e . >/dev/null 2>&1 <<< "$RESPONSE"; then
            RESPONSE='{"error":{"message":"invalid_json"}}'
          fi

          API_ERROR="$(
            jq -r '.error.message // empty' <<< "$RESPONSE"
          )"

          BODY="$(
            extract_body <<< "$RESPONSE"
          )"

          USED_MODEL="$GEMINI_MODEL"

          if [ -n "$API_ERROR" ] || [ -z "${BODY//[[:space:]]/}" ]; then
            RESPONSE="$(request_model "$GEMINI_FALLBACK_MODEL")"

            if ! jq -e . >/dev/null 2>&1 <<< "$RESPONSE"; then
              RESPONSE='{"error":{"message":"invalid_json"}}'
            fi

            API_ERROR="$(
              jq -r '.error.message // empty' <<< "$RESPONSE"
            )"

            BODY="$(
              extract_body <<< "$RESPONSE"
            )"

            USED_MODEL="$GEMINI_FALLBACK_MODEL"
          fi

          output gemini_used_model "$USED_MODEL"

          if [ -n "$API_ERROR" ]; then
            output has_ai_notes false
            output ai_reason gemini_api_error
            exit 0
          fi

          if [ -z "${BODY//[[:space:]]/}" ]; then
            output has_ai_notes false
            output ai_reason empty_response
            exit 0
          fi

          printf '%s\n' "$BODY" > gemini_release_notes.md

          output has_ai_notes true
          output ai_reason success

      - name: Fallback Release Notes
        if: ${{ steps.ai.outputs.has_ai_notes != 'true' }}

        shell: bash

        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          PREVIOUS_TAG: ${{ needs.meta.outputs.previous_tag }}

        run: |
          set -euo pipefail

          if [ -n "${PREVIOUS_TAG:-}" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          {
            echo "# Release $RELEASE_TAG"
            echo
            echo "## Changes"

            git log \
              "$RANGE" \
              --no-merges \
              --pretty=format:'- %s' |
            sed '/^[[:space:]]*$/d' |
            head -n 120

            echo
            echo
            echo "## Verification"
            echo "- Flutter analysis and automated tests passed before publication."

            if [ -n "${PREVIOUS_TAG:-}" ]; then
              echo
              echo "**Full Changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            fi
          } > fallback_release_notes.md

      - name: Release Notes auswählen
        shell: bash

        env:
          HAS_AI_NOTES: ${{ steps.ai.outputs.has_ai_notes }}

        run: |
          if [ "$HAS_AI_NOTES" = "true" ]; then
            cp gemini_release_notes.md release_notes.md
          else
            cp fallback_release_notes.md release_notes.md
          fi

      - name: Release Notes hochladen
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error
          retention-days: 3

      - name: Release-Notes Status
        if: always()

        env:
          AI: ${{ steps.ai.outputs.has_ai_notes }}
          REASON: ${{ steps.ai.outputs.ai_reason }}
          MODEL: ${{ steps.ai.outputs.gemini_used_model }}

        run: |
          {
            echo "## 📝 Release Notes"
            echo
            echo "- Gemini erfolgreich: \`$AI\`"
            echo "- Status: \`$REASON\`"
            echo "- Modell: \`$MODEL\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────
  # ANDROID
  #
  # APK + AAB absichtlich EIN Job:
  # - nur 1 Checkout
  # - nur 1 Flutter Setup
  # - nur 1 pub get
  # - nur 1 Java Setup
  # - nur 1 Signing Setup
  # - Gradle kann Build-State wiederverwenden
  # ──────────────────────────────────────────────────────────────

  build_android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    needs:
      - meta
      - quality_checks

    if: >-
      ${{
        always() &&
        needs.meta.result == 'success' &&
        needs.quality_checks.result == 'success' &&
        (
          needs.meta.outputs.build_apk == 'true' ||
          needs.meta.outputs.build_aab == 'true'
        )
      }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Java + Gradle Cache
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

          cache: gradle

          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: fllama Cache
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}

        uses: actions/cache@v6

        with:
          path: ~/.cache/fllama

          key: >-
            ${{ runner.os }}-${{ runner.arch }}-
            fllama-android-
            flutter-${{ env.FLUTTER_VERSION }}-
            ${{ hashFiles('pubspec.lock') }}

          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fllama-android-

      - name: Dependencies installieren
        run: flutter pub get

      - name: Android Signing einrichten
        shell: bash

        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |
          set -euo pipefail

          if \
            [ -z "${KEYSTORE_BASE64:-}" ] ||
            [ -z "${KEY_STORE_PASSWORD:-}" ] ||
            [ -z "${KEY_ALIAS:-}" ] ||
            [ -z "${KEY_PASSWORD:-}" ]
          then
            echo "::error::Android-Signing-Secrets fehlen."
            exit 1
          fi

          keystore="$RUNNER_TEMP/upload-keystore.jks"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$keystore"

          chmod 600 "$keystore"

          {
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$keystore"
          } > android/key.properties

          chmod 600 android/key.properties

      - name: Universal APK bauen
        if: ${{ needs.meta.outputs.build_apk == 'true' }}

        env:
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          APP_VERSION: ${{ needs.meta.outputs.app_version }}

        run: |
          flutter build apk \
            --release \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE"

      - name: ABI APKs bauen
        if: >-
          ${{
            needs.meta.outputs.build_apk == 'true' &&
            needs.meta.outputs.split_per_abi == 'true'
          }}

        env:
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          APP_VERSION: ${{ needs.meta.outputs.app_version }}

        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE"

      - name: AAB bauen
        if: ${{ needs.meta.outputs.build_aab == 'true' }}

        env:
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          APP_VERSION: ${{ needs.meta.outputs.app_version }}

        run: |
          flutter build appbundle \
            --release \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE"

      - name: Android Artefakte vorbereiten
        shell: bash

        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          BUILD_APK: ${{ needs.meta.outputs.build_apk }}
          BUILD_AAB: ${{ needs.meta.outputs.build_aab }}
          SPLIT: ${{ needs.meta.outputs.split_per_abi }}

        run: |
          set -euo pipefail

          mkdir -p android_artifacts

          if [ "$BUILD_APK" = "true" ]; then
            universal="build/app/outputs/flutter-apk/app-release.apk"

            [ -f "$universal" ] || {
              echo "::error::Universal APK fehlt."
              exit 1
            }

            cp \
              "$universal" \
              "android_artifacts/UntisPlus-${RELEASE_TAG}-universal.apk"

            if [ "$SPLIT" = "true" ]; then
              for abi in \
                armeabi-v7a \
                arm64-v8a \
                x86_64
              do
                source="build/app/outputs/flutter-apk/app-${abi}-release.apk"

                [ -f "$source" ] || {
                  echo "::error::ABI APK fehlt: $source"
                  exit 1
                }

                cp \
                  "$source" \
                  "android_artifacts/UntisPlus-${RELEASE_TAG}-${abi}.apk"
              done
            fi
          fi

          if [ "$BUILD_AAB" = "true" ]; then
            bundle="build/app/outputs/bundle/release/app-release.aab"

            [ -f "$bundle" ] || {
              echo "::error::AAB fehlt."
              exit 1
            }

            cp \
              "$bundle" \
              "android_artifacts/UntisPlus-${RELEASE_TAG}.aab"
          fi

      - name: Signing-Dateien entfernen
        if: always()
        shell: bash

        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Android Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: android_artifacts/
          if-no-files-found: error

          # APK/AAB sind bereits komprimiert
          compression-level: 0

          retention-days: 3

      - name: Android Build Summary
        if: success()

        shell: bash

        run: |
          {
            echo "## 🤖 Android Build"
            echo
            echo "| Datei | Größe |"
            echo "|---|---:|"

            for file in android_artifacts/*; do
              size="$(
                du -h "$file" |
                cut -f1
              )"

              echo "| \`$(basename "$file")\` | $size |"
            done
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────
  # IOS
  # ──────────────────────────────────────────────────────────────

  build_ipa:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 60

    needs:
      - meta
      - quality_checks

    if: >-
      ${{
        always() &&
        needs.meta.result == 'success' &&
        needs.quality_checks.result == 'success' &&
        needs.meta.outputs.build_ipa == 'true'
      }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: fllama Cache
        if: ${{ needs.meta.outputs.use_fllama_cache == 'true' }}

        uses: actions/cache@v6

        with:
          path: ~/.cache/fllama

          key: >-
            ${{ runner.os }}-${{ runner.arch }}-
            fllama-ios-
            flutter-${{ env.FLUTTER_VERSION }}-
            ${{ hashFiles('pubspec.lock') }}

          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fllama-ios-

      - name: CocoaPods Download-Cache
        uses: actions/cache@v6

        with:
          path: ~/Library/Caches/CocoaPods

          key: >-
            ${{ runner.os }}-
            cocoapods-
            ${{ hashFiles('ios/Podfile.lock', 'pubspec.lock') }}

          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Dependencies installieren
        run: flutter pub get

      - name: iOS bauen
        env:
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}
          APP_VERSION: ${{ needs.meta.outputs.app_version }}

        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$VERSION_CODE"

      - name: IPA erstellen
        shell: bash

        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}

        run: |
          set -euo pipefail

          app="build/ios/iphoneos/Runner.app"

          [ -d "$app" ] || {
            echo "::error::Runner.app wurde nicht erzeugt."
            exit 1
          }

          rm -rf Payload ipa_artifacts

          mkdir -p Payload ipa_artifacts

          ditto \
            --norsrc \
            "$app" \
            Payload/Runner.app

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Payload \
            "ipa_artifacts/UntisPlus-${RELEASE_TAG}.ipa"

          rm -rf Payload

      - name: IPA hochladen
        uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: ipa_artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: iOS Build Summary
        if: success()

        shell: bash

        run: |
          file="$(find ipa_artifacts -name '*.ipa' -print -quit)"

          size="$(
            du -h "$file" |
            cut -f1
          )"

          {
            echo "## 🍎 iOS Build"
            echo
            echo "- Datei: \`$(basename "$file")\`"
            echo "- Größe: **$size**"
            echo "- Signing: unsigned"
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────
  # RELEASE
  # ──────────────────────────────────────────────────────────────

  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      actions: write

    needs:
      - meta
      - quality_checks
      - release_notes
      - build_android
      - build_ipa

    if: >-
      ${{
        always() &&
        needs.meta.result == 'success' &&
        needs.quality_checks.result == 'success' &&
        needs.release_notes.result == 'success' &&
        (
          needs.build_android.result == 'success' ||
          needs.build_android.result == 'skipped'
        ) &&
        (
          needs.build_ipa.result == 'success' ||
          needs.build_ipa.result == 'skipped'
        )
      }}

    steps:
      - name: Android Artefakte herunterladen
        if: >-
          ${{
            needs.meta.outputs.build_apk == 'true' ||
            needs.meta.outputs.build_aab == 'true'
          }}

        uses: actions/download-artifact@v8

        with:
          name: release-android
          path: release_assets

      - name: IPA herunterladen
        if: ${{ needs.meta.outputs.build_ipa == 'true' }}

        uses: actions/download-artifact@v8

        with:
          name: release-ipa
          path: release_assets

      - name: Release Notes herunterladen
        uses: actions/download-artifact@v8

        with:
          name: release-notes
          path: release_assets

      - name: Checksums & Release Manifest
        shell: bash

        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          APP_VERSION: ${{ needs.meta.outputs.app_version }}
          VERSION_CODE: ${{ needs.meta.outputs.version_code }}

        run: |
          set -euo pipefail

          cd release_assets

          shopt -s nullglob

          binaries=(
            *.apk
            *.aab
            *.ipa
          )

          : > SHA256SUMS.txt

          if (( ${#binaries[@]} > 0 )); then
            printf '%s\0' "${binaries[@]}" |
              sort -z |
              xargs -0 sha256sum \
              > SHA256SUMS.txt
          fi

          assets="[]"

          if (( ${#binaries[@]} > 0 )); then
            assets="$(
              {
                for file in "${binaries[@]}"; do
                  kind="${file##*.}"
                  abi=""

                  case "$file" in
                    *-armeabi-v7a.apk)
                      abi="armeabi-v7a"
                      ;;

                    *-arm64-v8a.apk)
                      abi="arm64-v8a"
                      ;;

                    *-x86_64.apk)
                      abi="x86_64"
                      ;;

                    *-universal.apk)
                      abi="universal"
                      ;;
                  esac

                  jq -n \
                    --arg name "$file" \
                    --arg kind "$kind" \
                    --arg abi "$abi" \
                    --arg sha "$(
                      sha256sum "$file" |
                      awk '{print $1}'
                    )" \
                    --argjson size "$(
                      stat -c%s "$file"
                    )" \
                    '
                    {
                      name: $name,
                      type: $kind,
                      sha256: $sha,
                      size_bytes: $size
                    }
                    +
                    (
                      if ($abi | length) > 0
                      then {abi: $abi}
                      else {}
                      end
                    )
                    '
                done
              } | jq -s '.'
            )"
          fi

          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg version "$APP_VERSION" \
            --arg version_code "$VERSION_CODE" \
            --arg source_sha "$GITHUB_SHA" \
            --arg generated_at "$(
              date -u +%Y-%m-%dT%H:%M:%SZ
            )" \
            --argjson assets "$assets" \
            '
            {
              tag: $tag,
              version: $version,
              android_version_code: ($version_code | tonumber),
              source_sha: $source_sha,
              generated_at: $generated_at,
              assets: $assets
            }
            ' > release-manifest.json

      - name: Release-Dateien anzeigen
        shell: bash
        run: |
          echo "Release-Dateien:"
          find release_assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v3

        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}

          # Besonders wichtig bei workflow_dispatch:
          # Release zeigt exakt auf den getesteten Commit.
          target_commitish: ${{ github.sha }}

          name: ${{ needs.meta.outputs.release_name }}

          body_path: release_assets/release_notes.md

          files: |
            release_assets/*.apk
            release_assets/*.aab
            release_assets/*.ipa
            release_assets/SHA256SUMS.txt
            release_assets/release-manifest.json

          fail_on_unmatched_files: false

          draft: ${{ needs.meta.outputs.draft == 'true' }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}

        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: AltStore Source aktualisieren
        if: >-
          ${{
            needs.meta.outputs.build_ipa == 'true' &&
            needs.meta.outputs.draft == 'false'
          }}

        shell: bash

        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}

        run: |
          gh workflow run \
            altstore_source.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f tag="$RELEASE_TAG"

      - name: Fertig
        shell: bash

        env:
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          VERSION: ${{ needs.meta.outputs.app_version }}
          APK: ${{ needs.meta.outputs.build_apk }}
          AAB: ${{ needs.meta.outputs.build_aab }}
          IPA: ${{ needs.meta.outputs.build_ipa }}
          AI_NOTES: ${{ needs.release_notes.outputs.has_ai_notes }}

        run: |
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          {
            echo "# ✅ Release fertig"
            echo
            echo "## [$RELEASE_TAG öffnen]($RELEASE_URL)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| APK | $APK |"
            echo "| AAB | $AAB |"
            echo "| IPA | $IPA |"
            echo "| Gemini Release Notes | $AI_NOTES |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
