name: Wishkit to Github Issues

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  sync-wishkit:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Sync Wishkit Wishes
        uses: actions/github-script@v7
        env:
          WISHKIT_API_KEY: ${{ secrets.WISHKIT_API_KEY }}
        with:
          script: |
            const apiKey = process.env.WISHKIT_API_KEY;
            if (!apiKey) {
              core.setFailed("WISHKIT_API_KEY secret is not configured.");
              return;
            }

            // Fetch wishes from WishKit API
            const response = await fetch('https://api.wishkit.io/v1/wishes', {
              headers: {
                'Authorization': `Bearer ${apiKey}`,
                'Content-Type': 'application/json'
              }
            });

            if (!response.ok) {
              core.setFailed(`Failed to fetch from WishKit API: ${response.statusText}`);
              return;
            }

            const wishes = await response.json();

            // Fetch existing issue titles/labels to prevent duplicate creation
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            });

            const existingWishIds = new Set();
            existingIssues.forEach(issue => {
              const match = issue.body?.match(/WishKit ID:\s*([a-zA-Z0-9_-]+)/);
              if (match) existingWishIds.add(match[1]);
            });

            for (const wish of wishes) {
              if (existingWishIds.has(wish.id)) {
                continue; // Skip already created issues
              }

              const title = `[WishKit] ${wish.title || 'New Feedback'}`;
              const body = `${wish.description || 'No description provided.'}\n\n---\n**Votes:** ${wish.votesCount || 0}\n**WishKit ID:** ${wish.id}`;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['wishkit']
              });

              console.log(`Created GitHub Issue for WishKit ID: ${wish.id}`);
            }