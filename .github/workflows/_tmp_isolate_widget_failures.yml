name: Temporary isolate remaining widget failures

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_isolate_widget_failures.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Remove temporary workflow from PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp_isolate_widget_failures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_tmp_isolate_widget_failures.yml
          git commit -m 'Remove temporary widget isolation workflow'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Use local fllama stub
        shell: bash
        run: |
          cat > pubspec_overrides.yaml <<'EOF'
          dependency_overrides:
            fllama:
              path: tool/fllama_stub
          EOF
          flutter pub get

      - name: Weekly timetable viewport test
        id: weekly
        continue-on-error: true
        run: flutter test --no-pub test/widget_test.dart --plain-name 'weekly timetable fits phone and tablet viewports'

      - name: Timetable date tabs test
        id: tabs
        continue-on-error: true
        run: flutter test --no-pub test/widget_test.dart --plain-name 'timetable date tabs and weekly swipe stay interactive'

      - name: Timetable settings navigation test
        id: timetable_settings
        continue-on-error: true
        run: flutter test --no-pub test/widget_test.dart --plain-name 'timetable settings owns the lesson and card design entry'

      - name: Tablet settings breakpoint test
        id: tablet_settings
        continue-on-error: true
        run: flutter test --no-pub test/widget_test.dart --plain-name 'tablet navigation and settings switch at shared breakpoints'

      - name: Report outcomes
        shell: bash
        run: |
          echo "weekly=${{ steps.weekly.outcome }}"
          echo "tabs=${{ steps.tabs.outcome }}"
          echo "timetable_settings=${{ steps.timetable_settings.outcome }}"
          echo "tablet_settings=${{ steps.tablet_settings.outcome }}"
          test "${{ steps.weekly.outcome }}" = success
          test "${{ steps.tabs.outcome }}" = success
          test "${{ steps.timetable_settings.outcome }}" = success
          test "${{ steps.tablet_settings.outcome }}" = success
