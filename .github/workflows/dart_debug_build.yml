name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch für den Build'
        required: true
        default: 'main'
      flutter_version:
        description: 'Flutter-Version (z.B. 3.35.0)'
        required: true
        default: '3.35.0'
      artifact_name:
        description: 'Name des Artefakts'
        required: true
        default: 'debug-apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
