name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch für den Build'
        required: true
        default: 'main'
      flutter_version:
        description: 'Flutter-Version'
        required: true
        default: '3.41.9'
      artifact_name:
        description: 'Name des Artefakts'
        required: true
        default: 'debug-apk'
      use_fllama_cache:
        description: 'fllama-Native-Build-Cache verwenden (bei false wird frisch kompiliert)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'

      - name: Cache fllama native builds
        if: ${{ github.event.inputs.use_fllama_cache == 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/fllama
          key: ${{ runner.os }}-fllama-android-${{ hashFiles('pubspec.lock') }}

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
