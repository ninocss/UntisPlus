name: Temporary fix local provider test scrolling

on:
  push:
    branches:
      - fix/flutter-test-stability
    paths:
      - .github/workflows/_tmp_fix_local_provider_scroll.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/flutter-test-stability
          fetch-depth: 0

      - name: Fix local provider scroll direction
        shell: python
        run: |
          from pathlib import Path

          path = Path('test/widget_test.dart')
          source = path.read_text(encoding='utf-8')
          old = """    await tester.scrollUntilVisible(\n      localProvider,\n      180,\n      scrollable: providerScroll,\n    );\n    await tester.pump(const Duration(milliseconds: 100));\n    await tester.tap(localProvider);"""
          new = """    await tester.scrollUntilVisible(\n      localProvider,\n      -180,\n      scrollable: providerScroll,\n    );\n    await tester.pump(const Duration(milliseconds: 100));\n    final visibleLocalProvider = localProvider.hitTestable();\n    expect(visibleLocalProvider, findsOneWidget);\n    await tester.tap(visibleLocalProvider);"""
          if source.count(old) != 1:
              raise SystemExit(f'local provider scroll target count: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_fix_local_provider_scroll.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f test/widget_test.dart
          git add -A .github/workflows
          git commit -m 'Fix local AI provider test scrolling'
          git push origin HEAD:fix/flutter-test-stability

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Run full test suite with local AI stub
        shell: pwsh
        run: ./tool/test_without_local_ai.ps1
